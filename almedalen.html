<script>
(function(){
  if(window.__almeLoaded) return; window.__almeLoaded=true;
  var STANDALONE = true;
  var DATA = {"ui": {"sv": {"live": "DIREKT", "full": "Talet i sin helhet", "close": "Stäng", "fab": "Talet", "read": "Läs talet"}, "en": {"live": "LIVE", "full": "Full speech", "close": "Close", "fab": "Speech", "read": "Read the speech"}, "ko": {"live": "LIVE", "full": "연설문 전문", "close": "닫기", "fab": "연설문", "read": "연설문 보기"}}, "langNames": {"sv": "Svenska", "en": "English", "ko": "한국어"}, "loc": {"sv": "Almedalen, Visby · 2026", "en": "Almedalen, Visby · 2026", "ko": "스웨덴 알메달렌(비스뷔) · 2026"}, "photo": "https://www.xn--4k0b53xuva.com/hero.jpg", "photoFallback": ["https://www.xn--4k0b53xuva.com/face.jpg", "https://www.xn--4k0b53xuva.com/about.jpg"], "name": "김보미 · Kim Bomi", "bio": {"sv": "Demokratiska partiet · kvinnlig ungdomspolitiker. Tidigare ordförande i Gangjins kommunfullmäktige — Sydkoreas yngsta någonsin. Politiker sedan 13 år och grundare av medborgarplattformen för finansiell tillsyn ”Korea Finans 365”.", "en": "Democratic Party of Korea · woman and youth politician. Former Chair of Gangjin County Council — the youngest in the nation’s history. A politician of 13 years and founder of the citizen fiscal-watchdog platform ‘Korea Finance 365’.", "ko": "더불어민주당 · 여성·청년 정치인. 前 강진군의회 의장(전국 최연소). 13년차 정치인으로 시민 재정감시 플랫폼 『대한민국 재정 365』을 설계·운영."}, "title": {"ko": ["2026 스웨덴 알메달렌 정치주간 · 광장연설", "더불어민주당 · 여성·청년 정치인 김보미", "\u003c 정당민주주의와 청년정치 >", "광장으로 걸어 나온 청년, 정당민주주의를 묻다", "— 위선의 알을 깨고, 광장에 공정의 깃발을 세우다 —"], "sv": ["Almedalsveckan 2026, Sverige · Torgtal", "Demokratiska partiet · Kvinnlig ungdomspolitiker — Kim Bomi", "‹ Partidemokrati och ungdomspolitik ›", "En ung kvinna kliver fram på torget och ifrågasätter partidemokratin", "— Att krossa hycklarens äggskal och resa rättvisans fana på torget —"], "en": ["Almedalen Political Week 2026, Sweden · Town-Square Address", "Democratic Party of Korea · Woman & Youth Politician — Kim Bomi", "‹ Party Democracy and Youth Politics ›", "A young woman walks into the square and questions party democracy", "— Breaking the eggshell of hypocrisy, raising the flag of fairness in the square —"]}, "sections": [{"head": {"ko": "58년 전의 트럭 짐칸, 그리고 서른여섯 청년 김보미", "sv": "Ett lastbilsflak för 58 år sedan — och Kim Bomi, 36 år", "en": "A Truck Bed, 58 Years Ago — and Kim Bomi, 36"}, "paras": {"ko": ["대한민국 남쪽 끝, 전라남도 강진에서 온 더불어민주당 김보미입니다. 저는 올해 서른여섯 살입니다. 인구 3만 명의 작은 농촌 마을에서 군의원으로 일하고 있습니다. 오늘 민주주의의 상징인 알메달렌 광장에서 여러분과 만나게 되어 매우 영광입니다.", "58년 전 이곳에서 올로프 팔메 총리는 트럭 짐칸에 올라 연설했습니다. 무대도 없었습니다. 화려한 장치도 없었습니다. 시민과 정치인을 가르는 높은 벽도 없었습니다. 그 작은 시작은, 오늘날 세계적인 민주주의 축제가 되었습니다.", "알메달렌에서는 어디서나 정당과 시민이 함께 토론합니다. 장관과 노동조합이 같은 공간에서 대화합니다. 청년과 노년이 서로의 생각을 나눕니다. 저는 이 풍경이 매우 인상적이었습니다.", "민주주의는 상대를 이기는 기술이 아니라 함께 설득하는 과정이라는 사실을 새삼 느꼈습니다. 저는 알메달렌의 이런 정신을 한국 정치에, 꼭. 심고 싶습니다.", "저는 지금 대한민국의 집권 정당인, 민주당에서, 13년 동안 활동했습니다. 지방의원으로는 8년 동안 일했습니다. 스물여덟 살에 농촌 지역 최연소 군의원이 되었고, 이후 대한민국 최연소 기초의회 의장이 되기도 했습니다.", "저는 정치인 집안이 아닙니다. 정치를 하는 데 필요한 재력도 없었습니다. 조직도 없었습니다. 유력 정치인의 후원도 없었습니다.", "제가 가진 것은 단 하나였습니다. “시민의 목소리를 끝까지 듣고, 시민과 함께 문제를 해결하겠다”는 신념뿐이었습니다. 그 신념 하나로 정치를 해왔습니다.", "대한민국 지방자치는 스웨덴과 조금 다릅니다. 지방의회가, 주민이 직접 뽑은 시장을, 견제하는 구조입니다.", "저는 같은 당 출신 군수가 잘못하면 비판했습니다. 그것이 제가 해야 할, 역할이라고 믿었기 때문입니다. 저는 잘못된 예산을 원칙대로 삭감했습니다. 같은 당이기 때문에 눈감아 주는 관행을 따르지 않았습니다.", "그러자 다른 동료 의원들이, 저에 대한 의장 불신임안을 제출했습니다. 저를 따돌리기 시작했습니다. 인간적인 모욕도 이어졌습니다. 저에게 범죄 혐의가 있으니 수사해야 한다는 압박도 있었습니다. 영장도 없이 제 차량을 수색하기도 했습니다.", "왜 이런 일이 벌어졌을까요? 저는 그 이유를 잘 알고 있습니다. 제가 너무 젊었기 때문입니다. 또한 제가 여성이었기 때문입니다. 그리고 당의 눈치보다 시민의 요구를 더 중요하게 생각했기 때문입니다.", "불신임안을 제출했지만 기득권은 저를 무너뜨리지 못했습니다. 저를 지켜준 것은 시민이었습니다. 광장의 시민들과 청년들이었습니다.", "같은 당 의원들이 불신임안을 제출하자, 단 하루 만에 1,000명이 넘는 시민과 청년이 반대 운동에 나섰습니다. 결국 불신임안은 통과되지 못했습니다.", "저는 그때 분명히 깨달았습니다. 정치인이 시민을 지키는 것이 아니라, 깨어 있는 시민이, 정치를, 바로 세운다는 것을 알았습니다. 시민이야말로, 지방자치의 진짜. 주인인 것입니다.", "존경하는 세계 시민 여러분. 저는 지난 며칠 동안 이곳, 알메달렌에 있었습니다. 알메달렌 공원에는 100미터가 넘는 긴 테이블이 놓여 있었습니다. 청소년부터 기성세대까지 나란히 앉아 있었습니다. 국적도 달랐고 언어도 달랐습니다. 하지만 청년들이 안고 있는 고민에는 국경이 없었습니다.", "무대에서는 여덟 개 정당의 청년 대표들이 임대주택 문제와 청소년 범죄 대책을 놓고 토론했습니다. 정치적 입장이 달라도 좋은 정책에는 함께 동의했습니다. 같은 진영에 있어도 생각이 다르면 다른 의견을 냈습니다. 저는 그 모습을 매우 인상 깊게 보았습니다.", "저는 그 장면 속에서 정치의 본래 모습을 보았습니다. 정치는 “누구의 편인가”를 묻는 것이 아니라, “어떤 정책이 더 좋은가”를 놓고 경쟁하는 일이어야 합니다. 정치는 사람을 따르는 것이 아니라, 가치를 선택하는 과정이어야 합니다.", "그러나 대한민국의 현실은 아직 다릅니다. 우리는 정책을 이야기하기 전에 먼저 “너는 누구 사람이냐”를 묻는 경우가 많습니다. 어떤 비전을 가졌는지보다 어느 계파에 속해 있는지를 먼저 따집니다. 저는 이것이 한국 정치가 넘어야 할! 가장 큰 벽 가운데 하나라고 생각합니다.", "대한민국에도 이런 테이블이 필요합니다. 서로 다른 생각을 가진 사람들이 함께 앉아 이야기하는 공간이 필요합니다. 줄을 서는 정치가 아니라, 정책으로 경쟁하는 정치가 필요합니다. 사람을 중심으로 나누는 정치가 아니라, 해결책을 중심으로 토론하는 정치가 필요합니다. 저는 알메달렌에서 그 가능성을 보았습니다. 그리고 그 정신을 대한민국으로 가져가고 싶습니다."], "sv": ["Tack så mycket! Jag heter Kim Bomi och kommer från Gangjin i Jeollanam-do längst nere i södra Korea. Jag är 36 år gammal. Jag arbetar som ledamot i kommunfullmäktige i en liten landsbygdskommun med cirka 30 000 invånare. Det är en stor ära att få möta er här idag på Almedalen, en symbol för demokratin.", "För 58 år sedan stod Olof Palme på ett lastbilsflak här och höll tal. Det fanns ingen scen. Det fanns inga stora arrangemang. Det fanns inga höga murar mellan politiker och medborgare. Den lilla början har vuxit till en av världens mest kända demokratifestivaler.", "I Almedalen möts partier och medborgare överallt i samtal. Ministrar och fackföreningar diskuterar med varandra. Unga och äldre delar sina tankar och erfarenheter. Denna bild har gjort ett starkt intryck på mig.", "Här påmindes jag åter om att demokrati inte handlar om att besegra varandra. Demokrati handlar om att övertyga varandra och att lyssna på varandra. Jag vill ta med mig denna anda från Almedalen till koreansk politik.", "Jag har varit aktiv i Koreas demokratiska parti i tretton år. Jag har arbetat som lokalpolitiker i åtta år. När jag var 28 år blev jag den yngsta kommunfullmäktigeledamoten i min region. Senare blev jag också den yngsta ordföranden för ett lokalt fullmäktige i Sydkoreas historia.", "Jag kommer inte från en politisk familj. Jag hade inga pengar. Ingen stark organisation bakom mig. Ingen inflytelserik politiker som stödde mig.", "Det enda jag hade var en övertygelse. Att lyssna till människors röster ända till slutet. Att lösa problem tillsammans med medborgarna. Det är den övertygelsen som har lett mig i politiken.", "Det lokala självstyret i Sydkorea fungerar lite annorlunda än i Sverige. Kommunfullmäktige har till uppgift att granska och kontrollera den borgmästare som väljs direkt av invånarna.", "Jag kritiserade även ledare från mitt eget parti när de gjorde fel. Jag gjorde det därför att jag ansåg att det var mitt ansvar. Jag stoppade felaktiga budgetar. Jag vägrade att blunda bara därför att vi tillhörde samma parti.", "Då lade andra ledamöter fram ett misstroendeförslag mot mig. Jag blev utfryst. Jag utsattes för personliga förolämpningar. Det fanns försök att få mig föremål för utredningar. Min bil genomsöktes till och med utan domstolsbeslut.", "Varför hände detta? Jag tror att jag vet svaret. Jag var ung. Jag var kvinna. Och jag valde att lyssna mer på medborgarna än på partiets makthavare.", "Men makten lyckades inte knäcka mig. Det var medborgarna som skyddade mig. Det var människorna på torget. Det var de unga.", "När misstroendeförslaget lades fram, startade över tusen medborgare och unga människor en protestkampanj på bara ett dygn. Förslaget föll.", "Då förstod jag något viktigt. Det är inte politiker som räddar demokratin. Det är vakna och engagerade medborgare som gör det. Det är medborgarna som är det lokala självstyrets verkliga ägare.", "Kära världsmedborgare. Under de senaste dagarna har jag deltagit här i Almedalen. I Almedalsparken stod ett långt bord, över hundra meter långt. Ungdomar och äldre generationer satt sida vid sida. De kom från olika länder och talade olika språk. Men de frågor och bekymmer som unga människor bär på känner inga nationsgränser.", "På scenerna såg jag unga företrädare från åtta olika politiska partier. De diskuterade bostäder för unga och hur samhället ska möta ungdomsbrottslighet. Trots olika politiska uppfattningar kunde de enas kring goda förslag. Och även inom samma politiska läger vågade de uttrycka olika åsikter. Det gjorde starkt intryck på mig.", "I de ögonblicken såg jag politikens ursprungliga mening. Politik handlar inte om att fråga: “Vems sida står du på?” Politik handlar om att fråga: “Vilken politik är bäst för samhället?” Politik bör inte handla om att följa människor. Den bör handla om att välja värderingar och idéer.", "Men verkligheten i Sydkorea ser fortfarande annorlunda ut. Alltför ofta frågar vi först: “Vem tillhör du?” innan vi frågar: “Vilken politik förespråkar du?” Människor bedöms ibland utifrån vilken grupp de tillhör, snarare än utifrån sina idéer och sin vision. Jag tror att detta är en av de största murar som koreansk politik måste övervinna.", "Sydkorea behöver också sådana bord. Vi behöver fler platser där människor med olika åsikter kan sitta tillsammans och samtala. Vi behöver en politik som bygger på idéer, inte på köer bakom mäktiga personer. Vi behöver en politik som tävlar med lösningar, inte med lojaliteter. Här i Almedalen har jag sett att det är möjligt. Och jag vill ta med mig den andan hem till Sydkorea."], "en": ["Tack så mycket! I am Kim Bomi of the Democratic Party of Korea, from Gangjin in Jeollanam-do, at the southern tip of the Republic of Korea. I am thirty-six years old. I serve as a councillor in a small rural community of about thirty thousand people. It is a great honour to meet you today here in Almedalen, a square that has become a symbol of democracy.", "Fifty-eight years ago, on this very spot, Prime Minister Olof Palme climbed onto the bed of a truck and gave a speech. There was no stage. There were no elaborate arrangements. There was no high wall dividing citizens from politicians. That small beginning has grown into one of the world’s most renowned festivals of democracy.", "In Almedalen, parties and citizens debate together wherever you look. Ministers and trade unions talk in the same space. The young and the old share their thoughts. This scene made a deep impression on me.", "I was reminded once again that democracy is not the art of defeating your opponent, but the process of persuading one another and listening to one another. I want to plant this spirit of Almedalen firmly in Korean politics.", "I have been active in Korea’s governing Democratic Party for thirteen years. I have served as a local councillor for eight years. At twenty-eight I became the youngest county councillor in my rural region, and later I became the youngest chair of a local council in the history of the Republic of Korea.", "I do not come from a political family. I had none of the wealth that a political career is supposed to need. I had no organisation. I had no backing from any powerful politician.", "I had only one thing: the conviction that I would listen to the voices of citizens to the very end, and solve problems together with them. With that single conviction I have carried on in politics.", "Local self-government in Korea works a little differently from Sweden. The local council’s role is to check and hold to account the mayor whom residents elect directly.", "When a county governor from my own party did wrong, I criticised him — because I believed that was the role I had to play. I cut flawed budgets as the rules required. I refused to follow the custom of turning a blind eye simply because we belonged to the same party.", "In response, fellow councillors filed a motion of no confidence against me as chair. They began to freeze me out. Personal humiliations followed. There was pressure claiming I should be investigated over criminal allegations. My car was even searched without a warrant.", "Why did this happen? I know the reason well. It was because I was too young. It was because I was a woman. And it was because I cared more about the demands of citizens than about the moods of the party.", "They filed the motion, but the vested interests could not bring me down. What protected me were the citizens — the citizens and the young people of the square.", "When members of my own party filed that motion of no confidence, in just a single day more than a thousand citizens and young people rose up in a campaign against it. In the end, the motion did not pass.", "That was when I understood clearly: it is not politicians who protect citizens — it is awakened citizens who set politics right. The citizens are the true owners of local democracy.", "Esteemed citizens of the world. I have spent these past few days here in Almedalen. In Almedalen Park stood a long table, more than a hundred metres long. Teenagers and older generations sat side by side. Their nationalities differed and their languages differed. But the worries that young people carry know no borders.", "On the stage, youth representatives from eight political parties debated rental housing and measures against youth crime. Even when their political positions differed, they agreed together on good policy. And even within the same camp, when they thought differently, they voiced different opinions. I watched this with deep admiration.", "In that scene I saw the original form of politics. Politics should not ask, ‘Whose side are you on?’ It should be a contest over, ‘Which policy is better?’ Politics should not be about following people; it should be the process of choosing values.", "But the reality in Korea is still different. Before we talk about policy, we too often ask first, ‘Whose person are you?’ We weigh which faction someone belongs to before what vision they hold. I believe this is one of the greatest walls Korean politics must overcome.", "Korea needs tables like this too. We need spaces where people who think differently can sit together and talk. We need a politics that competes through policy, not a politics of standing in line. We need a politics that debates around solutions, not one that divides around people. In Almedalen I saw that this is possible. And I want to carry that spirit home to Korea."]}}, {"head": {"ko": "강진 군수 선거 출마", "sv": "Att kandidera till kommunstyrelseordförande i Gangjin", "en": "Running for County Governor of Gangjin"}, "paras": {"ko": ["저는 올해 6월3일 실시했던 대한민국 지방선거, 강진군수 선거에 출마했습니다. 하지만 민주당 공천을 받지 못했습니다. 저는 이것이, 공정을 잃은 결정이었다고 생각합니다.", "민주당은 원래 중대한 범죄 경력이 있는 후보에게 감점을 주거나, 공천을 제한하는 제도를 운영하고 있습니다.", "그런데 저와 경쟁한 후보는, 다섯 건의 범죄 전력이 있었음에도, 감점을 받지 않았습니다.", "반면 저는 감점을 받았습니다. 과거 당이 정한 군의회 의장을 선택하지 않고 다른 사람을 선택했다는 것이 이유였습니다.", "그 결과 저는, 민주당의 공천을 받지 못했습니다. 그리고 그렇게 억지로 규정을 바꿔가며 공천을 받은 민주당 후보는 본선에서 무소속 후보에게 패배했습니다. 민주당의 불공정이 부른 대가였습니다.", "대한민국 민주당을 비판하는 사람들이 하는 말이 있습니다. “민주당에는 민주주의가 없다.”고 합니다. 청년들은 실력과 정책보다 줄을 잘 서야 살아남는다고 말합니다.", "공천은 당원 명부도 공개하지 않고 진행됩니다. 투표한 사람 수도 공개하지 않습니다. 제가 몇 표를 받았는지, 저는 지금도 모릅니다.", "경선 규칙은 매우 복잡합니다. 너무 규정이 많아 규정이 없는 것과 같다고, 저는 말합니다. 국회의원과 당 지도부가 마음만 먹으면, 누군가는 떨어뜨리고, 누군가는 키울 수 있도록 규정을 수시로 고칩니다.", "이런 구조에서 청년은 설 자리를 찾기 어렵습니다. 간혹 바른 소리를 하는 청년이 있습니다. 하지만 기성 정치인과 다른 목소리를 내는 순간, 정치 생명이 끝나 버리기 때문에 쉽게 용기를 내지 못합니다."], "sv": ["I lokalvalet i Sydkorea den 3 juni i år kandiderade jag till posten som kommunstyrelseordförande i Gangjin. Men jag fick inte mitt partis nominering. Jag anser att beslutet saknade rättvisa.", "Mitt parti har regler som ger avdrag eller begränsar kandidater med allvarlig brottshistorik.", "Men kandidaten som konkurrerade med mig hade fem tidigare domar. Trots detta ändrades reglerna så att personen inte skulle få något avdrag, eftersom brotten ansågs gamla.", "Samtidigt fick jag själv avdrag. Motiveringen var att jag tidigare hade stött en annan kandidat till posten som fullmäktigeordförande än den som partiet föredrog.", "Resultatet blev att jag inte fick nomineringen. Kandidaten som fick nomineringen efter dessa regeländringar förlorade sedan valet mot en oberoende kandidat. Jag anser att det var priset för ett orättvist nomineringssystem.", "Det finns människor som kritiserar Demokratiska partiet och säger: ”Det finns ingen verklig demokrati inom partiet.” Många unga säger att man inte överlever genom kompetens och idéer, utan genom att stå nära rätt personer.", "Nomineringarna genomförs utan att medlemslistorna offentliggörs. Antalet röstande offentliggörs inte. Valdeltagandet offentliggörs inte. Inte ens kandidaternas röstandelar offentliggörs. Jag vet fortfarande inte hur många röster jag fick.", "Reglerna för nomineringarna är mycket komplicerade. Jag brukar säga att det finns så många regler att det nästan känns som om det inte finns några regler alls. Om partiledningen vill kan reglerna ändras. Vissa gynnas och andra missgynnas.", "I ett sådant system är det svårt för unga människor att hitta sin plats. Det finns unga som vågar tala klarspråk. Men i samma ögonblick som de utmanar etablerade politiker riskerar deras politiska framtid att ta slut. Därför tvekar många att säga vad de egentligen tycker."], "en": ["In Korea’s local elections held on 3 June this year, I ran for the office of county governor of Gangjin. But I did not receive the Democratic Party’s nomination. I believe this was a decision that lost all sense of fairness.", "My party normally operates a system that gives penalty points to, or restricts the nomination of, candidates with a serious criminal record.", "And yet the candidate who ran against me had five prior convictions — and still received no penalty. The rules were changed so that the offences, deemed ‘too old’, would not count against him.", "I, on the other hand, was penalised. The reason given was that, in the past, I had chosen someone other than the council chair the party preferred.", "As a result, I did not receive the Democratic Party’s nomination. And the party’s candidate — the one who got the nomination after the rules were forcibly bent — went on to lose the general election to an independent. It was the price of the Democratic Party’s unfairness.", "There is something that people who criticise Korea’s Democratic Party say: ‘Inside the Democratic Party there is no democracy.’ Young people say that, to survive, you must stand in the right line rather than rely on ability and policy.", "Nominations are carried out without even disclosing the roll of party members. The number of people who voted is not disclosed. To this day, I do not know how many votes I received.", "The primary rules are extremely complicated. There are so many rules, I say, that it is as if there were no rules at all. Whenever the lawmakers and the party leadership wish, they revise the rules at will — so that one person can be knocked out and another lifted up.", "In a structure like this, young people struggle to find a place to stand. Now and then a young person speaks the truth. But the moment they raise a voice different from the established politicians, their political life can end — so they cannot easily find the courage."]}}, {"head": {"ko": "‘1인 1표’와 ‘당원주권’이라는 화려한 위선", "sv": "Det lysande hyckleriet i ”en person, en röst” och ”medlemmarnas makt”", "en": "The Dazzling Hypocrisy of ‘One Person, One Vote’ and ‘Member Sovereignty’"}, "paras": {"ko": ["지금 전 세계가 함께 고민하는 정치적 문제가 있습니다. 미래의 주인이어야 할 청년 세대가, 기성 정당에 등을 돌리고 있다는 점입니다. 대한민국도 예외가 아닙니다.", "기성 정치인들은, 청년이 문제라고 말합니다. 요즘 젊은 세대는 역사의식이 부족하다고 말합니다. 청년들은 이기적이라고 비판하기도 합니다. 하지만 저는, 그렇게 생각하지 않습니다.", "청년을 절망으로 밀어 넣은 진짜 원인은 따로 있습니다. 바로 기성 정당과 기성 정치인의 위선과 불공정입니다. 청년들은 정치 자체를 싫어하는 것이 아닙니다. 공정하지 않은 정치를 싫어하는 것입니다.", "다시 말씀드리면, 청년의 급격한 보수화나 극단화는 청년 개인의 문제가 아닙니다. 기득권을 지키려는 낡은 정치가 뿌린 씨앗인 것입니다. 저는 이것을 매우 심각하게 생각합니다."], "sv": ["Det finns en politisk fråga som demokratier över hela världen brottas med. Allt fler unga människor vänder de etablerade partierna ryggen. Sydkorea är inget undantag.", "Många etablerade politiker säger att ungdomarna är problemet. De säger att unga saknar historiskt perspektiv. De säger att unga är själviska. Men jag håller inte med.", "Den verkliga orsaken finns någon annanstans. Det handlar om hyckleri och orättvisa inom den etablerade politiken. Unga människor hatar inte politik. De hatar orättvisa.", "Låt mig säga det igen. Ungas radikalisering eller snabba politiska förskjutningar är inte bara ett ungdomsproblem. Det är också ett resultat av ett politiskt system som försöker skydda sina egna privilegier. Jag ser detta som en mycket allvarlig demokratisk fråga."], "en": ["There is a political problem the whole world is wrestling with today: the young generation, who ought to be the owners of the future, are turning their backs on the established parties. Korea is no exception.", "Established politicians say that young people are the problem. They say today’s young generation lacks a sense of history. They even criticise the young as selfish. But I do not agree.", "The real cause that pushed young people into despair lies elsewhere. It is the hypocrisy and unfairness of the established parties and the established politicians. Young people do not hate politics itself. They hate politics that is not fair.", "Let me say it again: the sudden swing of the young toward conservatism or extremes is not a problem of young individuals. It is the seed sown by an old politics trying to protect its own privileges. I take this very seriously, as a grave question for democracy."]}}, {"head": {"ko": "“가만히 있으라”는 거짓말에 더는 속지 않습니다", "sv": "Jag låter mig inte längre luras av lögnen ”sitt still”", "en": "I Will No Longer Be Fooled by the Lie ‘Stay Still’"}, "paras": {"ko": ["지금 한국은 거대한, 대전환의 시대를 지나고 있습니다. 인공지능이 산업을, 바꾸고 있습니다. 일자리를, 바꾸고 있습니다. 국가의 경쟁력 자체를, 바꾸고 있습니다.", "그 거대한 변화의 파도 앞에서 가장 먼저 흔들리는 것은, 청년의 삶입니다. 평생직장은 이미 사라졌습니다. 많은 청년들이 비정규직과, 플랫폼 노동에 의존하고 있습니다.", "평생 일해도 집 한 채 마련하기 어렵습니다. 어렵게 구한 전셋집마저 사기의 대상이 되고 있습니다. 연애도 어렵고, 결혼도, 어렵습니다. 출산은 더 어려워졌습니다.", "청년들은 열심히 공부했습니다. 누구보다 성실하게 노력했습니다. 좋은 대학을 가고, 좋은 경력을 쌓기 위해, 애썼습니다.", "하지만 한 번 실패하면 다시 일어나기 어렵습니다. 목소리를 들어줄 정치인도 많이 없습니다. 청년들의 마음속에 좌절과 분노가 쌓이고 있습니다. 저는 그 분노를, 두려운 마음으로 바라봅니다.", "청년의 분노를, 책임 있게 대변하는 정치가 없다면, 그 분노는 결국, 가장 극단적인 목소리로 분출될 것입니다. 그래서 저는 청년의 분노를 정치 안으로 가져오고 싶습니다. 광장 안에서 해결하고 싶습니다.", "한국의 젊은 세대에게는 잊을 수 없는 기억이 있습니다. 2014년, 세월호 참사입니다. 수학여행을 가던 학생 (304명)들이 목숨을 잃었습니다.", "사고 당시 어른들은 학생들에게 말했습니다. “가만히 있어라.” 학생들은 그 말을 믿었습니다. 하지만 그 말을 들은 학생들은 끝내 돌아오지 못했습니다.", "그때 저는 스물네 살이었습니다. 그 사건은 제 인생을 바꾸었습니다. 저는 다짐했습니다. 다시는 부당한 권력 앞에서 침묵하지 않겠다고. 다짐했습니다.", "그런데 지금도 정치권에서는 비슷한 말을 합니다. “조금 더 기다려라.” “순서를 지켜라.” “당의 결정을 따르라.” 이렇게 말입니다. 하지만 저는 더 이상 그 말에 속지 않겠습니다.", "청년의 미래를, 믿을 수 없는 기득권 정치인들에게 맡길 수는 없습니다. 청년의 미래는 청년이 직접 결정해야 합니다.", "최근 한국에서는 매우 충격적인 일이 발생했습니다. 일부 지역에서 유권자들이 투표소에 갔지만, 투표용지가 부족해 투표를 하지 못한 일이 있었습니다.", "기성 정치인들은 말합니다. “결과가 달라지지 않으니 큰 문제가 아니다.” 하지만 청년들은 다르게 생각합니다. 청년들은 결과를 이야기하는 것이 아닙니다. 절차의 공정을 따지는 것입니다. 공정이 무너진 것에 분노하는 것입니다.", "저는 책임감을 느낍니다. 제가 지금 침묵하면 대한민국 청년의 미래가 무너집니다. 민주당의 미래도 무너집니다. 그래서 저는 불공정과 위선에 맞서려고 합니다."], "sv": ["Sydkorea befinner sig just nu mitt i en enorm omställning. Artificiell intelligens förändrar industrin. Den förändrar arbetsmarknaden. Den förändrar hela vår framtida konkurrenskraft som nation.", "Men mitt i denna stora förändring är det de unga som drabbas först. De livslånga anställningarna har i stort sett försvunnit. Många unga är beroende av tillfälliga jobb och plattformsarbete.", "Även ett helt livs arbete räcker ofta inte för att köpa en bostad. Till och med hyr- och bostadssystemen har blivit osäkra. Det har blivit svårare att hitta kärleken. Svårare att gifta sig. Och ännu svårare att bilda familj.", "Unga människor har studerat hårt. De har arbetat hårt. De har gjort allt samhället bad dem att göra.", "Men när de misslyckas en gång är det ofta svårt att resa sig igen. Och alltför få politiker lyssnar på deras röster. Därför växer frustrationen. Därför växer ilskan. Och den ilskan oroar mig.", "Om demokratin inte kan ge unga människor en röst, kommer ilskan att söka sig till mer extrema uttryck. Därför vill jag föra in den frustrationen i politiken. Jag vill att den ska få sin plats på torget, inte utanför det.", "Min generation bär också på ett djupt nationellt trauma. Det handlar om Sewol-katastrofen år 2014. 304 människor miste livet. De flesta var gymnasieelever på skolresa.", "När katastrofen inträffade sade vuxenvärlden till eleverna: ”Sitt still.” ”Stanna där ni är.” Eleverna lydde. Men många av dem kom aldrig hem igen.", "Jag var 24 år gammal då. Den tragedin förändrade mitt liv. Jag lovade mig själv något. Att aldrig vara tyst inför orättfärdig makt.", "Än i dag hör unga människor liknande budskap från politiken. ”Vänta lite till.” ”Följ ordningen.” ”Acceptera beslutet.” Men jag tänker inte längre acceptera det.", "Ungas framtid kan inte överlåtas till ett fåtal makthavare. Unga människor måste själva vara med och forma sin framtid.", "Nyligen inträffade något som chockade många i Sydkorea. På vissa håll tog valsedlarna slut. Väljare kom till vallokalerna men kunde inte rösta.", "Vissa politiker sade: ”Det påverkar ändå inte slutresultatet.” Men unga människor såg saken annorlunda. De diskuterade inte resultatet. De diskuterade rättvisan. De diskuterade processen.", "Jag känner ett ansvar. Om jag förblir tyst sviker jag nästa generation. Jag sviker också framtiden för mitt parti. Därför väljer jag att stå upp mot orättvisa och hyckleri."], "en": ["Korea is now passing through an era of enormous transformation. Artificial intelligence is changing industry. It is changing jobs. It is changing the very competitiveness of the nation.", "And before that great wave of change, the first lives to be shaken are those of the young. Lifelong employment has already vanished. Many young people depend on precarious and platform work.", "Even a lifetime of work is often not enough to afford a single home. Even the hard-won rental deposit has become a target of fraud. Love is hard, marriage is hard, and having children has become harder still.", "Young people studied hard. They worked more diligently than anyone. They strove to enter good universities and build good careers.", "But once they fail, it is hard to rise again. There are not many politicians who will listen to their voices. Frustration and anger are piling up in the hearts of the young. I look upon that anger with fear.", "If there is no politics to represent young people’s anger responsibly, that anger will, in the end, erupt through the most extreme voices. So I want to bring young people’s anger into politics. I want to resolve it within the square.", "Korea’s young generation carries a memory it can never forget: the Sewol ferry disaster of 2014. Three hundred and four people — most of them high-school students on a school trip — lost their lives.", "When the disaster struck, the adults told the students, ‘Stay still.’ The students believed those words. But the students who obeyed never came home again.", "I was twenty-four then. That event changed my life. I made a vow: never again would I stay silent before unjust power.", "And yet even now, the political world says similar things: ‘Wait a little longer.’ ‘Keep your turn.’ ‘Follow the party’s decision.’ But I will no longer be fooled by those words.", "The future of the young cannot be entrusted to vested-interest politicians who cannot be trusted. The future of the young must be decided by the young themselves.", "Recently something deeply shocking happened in Korea. In some areas, voters went to the polling stations but could not vote, because the ballot papers had run out.", "Established politicians say, ‘It does not change the outcome, so it is not a big problem.’ But young people think differently. They are not talking about the outcome. They are questioning the fairness of the process. They are angry that fairness has collapsed.", "I feel a sense of responsibility. If I stay silent now, the future of Korea’s young people collapses. The future of the Democratic Party collapses too. And so I choose to stand against unfairness and hypocrisy."]}}, {"head": {"ko": "민주당은 깜깜이 경선을 공개하라", "sv": "Demokratiska partiet — öppna era slutna nomineringsval", "en": "Democratic Party, Open Up Your Secret Primaries"}, "paras": {"ko": ["앞서 말씀드린 것처럼 저는 강진군수 선거에 민주당 공천을 신청했습니다. 정책공약집도 만들었고 비전도 만들었습니다.", "그러나 대한민국 정당의 경선에는 ‘토론’이 없습니다. 정책을 겨루는 무대가 없으니, 남는 것은 ‘누구의 사람이냐’는 줄 세우기뿐입니다. 그리고 그 자리에서, 가장 먼저 지워지는 것은. 늘, 청년입니다.", "유럽의 청년은 선거철 사진 속 배경이 아닙니다. 열다섯 살 소녀 그레타 툰베리가 홀로 의회 앞에 앉아 외친 목소리가, 전 세계를 움직였습니다. 유럽의 청년들은 십 대 시절부터 정당의 청년 조직에서 토론하며 성장합니다.", "그렇게 검증받은 청년들이 여러 나라에서 젊은 나이에 총리와 대통령으로 나라를 이끕니다. 나이가 어려서가 아닙니다. 어릴 때부터 토론하고 검증받을 무대가 열려 있었고, 우리에게는, 그 무대가, 닫혀 있었을 뿐입니다.", "토론이 살아 있는 정당에서는 청년도 실력으로 무대에 오릅니다. 하지만 토론이 사라진 정당에서는 줄 선 사람만 살아남습니다.", "저는 대한민국의 민주당이 바뀌어야 한다고 생각합니다. 과정을 공개하지 않는 깜깜이 공천을 폐기해야 합니다. 정책으로 정정당당히 겨루는 토론을 되살려야 합니다.", "청년에게 가산점 몇 퍼센트를 시혜하듯 얹어 주는 것은 공정이 아닙니다. 누구나 같은 무대에서 토론으로 검증받는 것, 그것이 청년을 정당으로 돌아오게 하는, 유일한 길입니다."], "sv": ["Som jag berättade tidigare kandiderade jag till posten som kommunstyrelseordförande i Gangjin. Jag tog fram ett politiskt program. Jag presenterade en vision för framtiden. Jag ville tävla med idéer och kompetens.", "Men i de interna nomineringsvalen i de koreanska partierna finns det nästan inga debatter. Det finns ingen verklig scen där politiska idéer kan mötas. Det finns få möjligheter att pröva kandidaternas visioner och övertygelser. Därför återstår ofta bara en fråga: ”Vems person är du?” Politiken förvandlas till ett system där människor placeras i led bakom olika makthavare.", "Unga människor i Europa är inte bara en bakgrund på valkampanjens fotografier. När Greta Thunberg, som femtonårig flicka, satt ensam framför parlamentet och höjde sin röst, började hennes röst röra hela världen. Unga människor i Europa tränas ofta tidigt genom samtal och debatter i partiernas ungdomsförbund.", "Unga politiker som prövats på det sättet har i flera länder kunnat leda sina nationer som statsministrar och presidenter i ung ålder. Inte därför att de bara var unga. Utan därför att de tidigt fick tillgång till arenor där de kunde debattera, prövas och växa. För oss har den arenan alltför ofta varit stängd.", "I ett parti där debatten lever kan även unga människor kliva upp på scenen genom sin kompetens. Men i ett parti där debatten försvinner överlever bara de som står i rätt kö.", "Jag anser att Demokratiska partiet i Sydkorea måste förändras. Vi måste avskaffa slutna nomineringar där processen hålls dold. Vi måste återuppliva debatter där kandidater konkurrerar öppet med politik och idéer.", "Att ge unga människor några extra procent som en sorts välvilja är inte rättvisa. Verklig rättvisa är att alla får prövas på samma scen, genom öppen debatt. Det är den enda vägen som kan få unga människor att återvända till politiken."], "en": ["As I said earlier, I applied for the Democratic Party’s nomination in the Gangjin county-governor election. I prepared a book of policy pledges, and I built a vision.", "But in the primaries of Korean parties there is no ‘debate’. With no stage on which to compete over policy, all that remains is the lining-up of ‘whose person are you?’ — and the first to be erased in that place is always the young.", "Young people in Europe are not mere backdrops in campaign-season photographs. When Greta Thunberg, a fifteen-year-old girl, sat alone in front of parliament and raised her voice, that voice moved the whole world. Young people in Europe are forged from their teens through debate in the youth wings of the parties.", "Young people tested in that way go on, in many countries, to lead their nations at a young age as prime ministers and presidents. It is not because they are young. It is because, from an early age, a stage was open to them where they could debate and be tested — while for us, that stage was simply kept shut.", "In a party where debate is alive, even the young rise to the stage on merit. But in a party where debate has disappeared, only those who stand in line survive.", "I believe Korea’s Democratic Party must change. We must abolish the secret nominations whose process is never disclosed. We must revive the debates in which candidates compete fairly and openly on policy.", "Tacking a few extra percentage points onto the young, as though bestowing a favour, is not fairness. For everyone to be tested on the same stage, through open debate — that is the only path that will bring young people back to the parties."]}}, {"head": {"ko": "정당민주주의 확립, 위선의 알을 깨겠습니다", "sv": "Att förankra partidemokratin — jag ska krossa hyckleriets äggskal", "en": "Establishing Party Democracy — I Will Break the Eggshell of Hypocrisy"}, "paras": {"ko": ["200여 년 전, 한국의 위대한 실학자 정약용은 정치의 본질을 묻는 질문을 남겼습니다.", "그는 유배지였던 제 고향 강진에서 이렇게 물었습니다. “백성을 위해, 목민관이 존재하는가. 아니면 목민관을 위해, 백성이 존재하는가.”", "저는 오늘 이 질문을, 대한민국의 정당들에게 그대로 던지고 싶습니다. 정당은, 당원과 국민을 위해 존재합니까? 아니면 당원과 국민이, 정당을 위해 존재합니까?", "지금 한국의 거대 정당들은 점점, 당원 명부를 쥔 기득권의 놀이터가 되어가고 있습니다.", "줄을 잘 서고 권력에 가까운 사람은 살아남고, 비판하는 사람은 불이익을 받기도 합니다. 이것은 정당민주주의가 아닙니다.", "정당민주주의는 거창한 이론이 아닙니다. 매우 단순한 원칙입니다. 정당의 주인은 정치인이 아니라, 당원이라는 것입니다! 공천의 권한은 밀실이 아니라, 광장에 있어야 합니다!", "권력자의 사무실이 아니라, 당원의 선택 속에 있어야 합니다! 가장 낮은 곳에 있는 청년도, 자신의 목소리를 낼 수 있어야 합니다!", "선거철에만 동원되는 들러리가 아니라, 정치를 직접 이끄는! 주인공이, 되어야 합니다. 저는 그것이, 진짜 정당민주주의라고 생각합니다.", "이곳 알메달렌에서는 총리도 학생도 시민도 누구나 여기 광장에 설 수 있습니다. 이게 바로, 민주주의입니다.", "저는 이 평등한 광장을 대한민국 정치 안으로 옮기고 싶습니다. 권력자만 단상에 오르는 정치를, 끝내고! 싶습니다.", "누구나 무대에 오를 수 있는 정치. 누구나 질문할 수 있는 정치. 누구나 토론할 수 있는 정치를. 만들고 싶습니다.", "시민과 청년 당원이 정치의 관객이 아니라, 주인이 되는 정치를, 만들고 싶습니다.", "오는 8월 민주당은 새로운 당 지도부를 선출합니다. 출마를 진지하게 고민하고 있습니다. 지금 많은 사람들의 의견을 듣고 있습니다. 여러분도 좋은 의견을 주십시오.", "작은 농촌 마을 출신의 젊은 여성 정치인이 집권여당 지도부 선거에 도전하겠다고 하자 벌써부터 무모하다는 말이 들립니다.", "하지만 저는, 이기기 위해서가 아니라, 바꾸기 위해! 도전하고 싶습니다! 인공지능이 세상을 바꾸는 시대입니다. 그러나 정치는 아직 과거에 머물러 있습니다. 저는 불공정, 불투명, 불통이라는 낡은 벽을 허물고 싶습니다.", "세대교체를 이루고 싶습니다. 늙고 낡은 민주당을 바꾸고 싶습니다. 저는 특정 정치인이 지배하는 ‘정치인의 정당’이 아니라, 당원이 주인이 되는 ‘모두의 민주당’을 만들고 싶습니다.", "제 이름 ‘보미’는 한국어로 만물이 소생하는 ‘봄’을 뜻합니다. 긴 겨울을 지나 새로운 계절이 시작되는 이름입니다.", "그리고 저는 우연히도 스웨덴어의 ‘우리’를 뜻하는 단어인 ‘보오르’와 발음도 비슷합니다.", "그래서, 저는 오늘 이 민주주의의 광장에서 선언합니다. 한국 정치의 가장 단단한! 불공정의 벽을 깨부수겠습니다. 낡은 정치의 벽을 깨부수겠습니다. 변화와 혁신의 봄을 열겠습니다."], "sv": ["För mer än tvåhundra år sedan ställde den koreanske tänkaren Jeong Yak-yong en enkel fråga om politikens kärna.", "I min hemstad Gangjin, där han levde i exil, frågade han: ”Finns ämbetsmannen till för folket? Eller finns folket till för ämbetsmannen?”", "I dag vill jag ställa samma fråga till de politiska partierna i Sydkorea. Finns partierna till för medborgarna? Eller finns medborgarna till för partierna?", "Alltför ofta håller de stora partierna på att bli arenor för dem som redan har makt.", "Människor nära makten gynnas. De som kritiserar riskerar att straffas. Det är inte partidemokrati.", "Partidemokrati är egentligen mycket enkelt. Partiets ägare ska inte vara politikerna. Partiets ägare ska vara medlemmarna. Nomineringar ska inte avgöras bakom stängda dörrar utan i öppenhet.", "Besluten ska inte fattas i makthavares kontor. De ska fattas genom medlemmarnas val. Även unga människor från de mest avlägsna platserna ska kunna göra sina röster hörda.", "Unga människor ska inte bara mobiliseras under valrörelser. De ska vara med och leda politiken. Det är vad verklig partidemokrati betyder för mig.", "Här i Almedalen kan statsministern tala på torget. En student kan tala på torget. En vanlig medborgare kan tala på torget. Det är demokrati.", "Jag vill ta med mig denna anda till Sydkorea. Jag vill göra slut på en politik där bara makthavarna står på scenen.", "Jag vill bygga en politik där alla kan gå upp på scenen. Där alla kan ställa frågor. Där alla kan delta i debatten.", "Jag vill skapa en politik där medborgare och unga partimedlemmar inte är åskådare utan huvudpersoner.", "Det är just denna mur jag vill utmana. I augusti väljer Demokratiska partiet en ny partiledare. Jag överväger seriöst att kandidera. Jag lyssnar på många människors råd. Och jag välkomnar även era tankar och synpunkter.", "Många säger redan att det är omöjligt. En ung kvinnlig politiker från en liten landsbygdskommun borde inte försöka leda landets största regeringsparti, säger de.", "Men jag vill inte kandidera för att vinna. Jag vill kandidera för att förändra. Vi lever i en tid då artificiell intelligens förändrar världen. Men politiken sitter fortfarande fast i gamla strukturer. Jag vill riva tre murar: orättvisa, brist på insyn och brist på kommunikation.", "Jag vill åstadkomma ett generationsskifte. Jag vill förnya ett parti som har blivit gammalt och stelbent. Jag vill inte ha ett parti som tillhör några få politiker. Jag vill bygga ett parti som tillhör medlemmarna. Ett parti för alla.", "Mitt namn, Bomi, betyder vår på koreanska. Det är årstiden då livet återvänder efter vintern.", "Och kanske påminner det också om det svenska ordet ”vår”.", "Därför vill jag ge ett löfte här i dag. På detta demokratiska torg. Jag vill krossa skalet av orättvisa. Jag vill bryta sönder det gamla politiska systemets äggskal. Jag vill öppna dörren för förändring, reformer och en ny vår."], "en": ["More than two hundred years ago, the great Korean scholar Jeong Yak-yong left behind a question asking after the essence of politics.", "In my hometown of Gangjin, where he lived in exile, he asked: ‘Does the magistrate exist for the people? Or do the people exist for the magistrate?’", "Today I want to put this same question to the political parties of Korea. Do the parties exist for their members and the people? Or do the members and the people exist for the parties?", "Right now, Korea’s giant parties are increasingly becoming the playground of vested interests who hold the membership rolls.", "Those who line up well and stand close to power survive; those who criticise are made to suffer for it. This is not party democracy.", "Party democracy is not some grand theory. It is a very simple principle: the owners of a party are not the politicians, but the members. The power of nomination must lie not in back rooms, but in the open square.", "It must lie not in the offices of the powerful, but in the choices of the members. Even a young person in the lowest place must be able to make their voice heard.", "They must not be extras mobilised only at election time, but the protagonists who lead politics directly. That, I believe, is true party democracy.", "Here in Almedalen, the prime minister can speak on the square. A student can speak on the square. An ordinary citizen can speak on the square. That is democracy.", "I want to move this equal square into Korean politics. I want to end a politics in which only the powerful step onto the platform.", "I want to build a politics where anyone can step onto the stage. A politics where anyone can ask questions. A politics where anyone can debate.", "I want to build a politics in which citizens and young party members are not the audience, but the owners.", "This August, the Democratic Party will elect a new leadership. I am seriously considering running. I am listening to the views of many people right now. Please give me your good counsel as well.", "When a young woman politician from a small rural community says she will challenge for the leadership of the governing party, I already hear the word ‘reckless’.", "But I want to take up the challenge not in order to win, but in order to change. We live in an age when artificial intelligence is transforming the world. Yet politics is still stuck in the past. I want to tear down three old walls: unfairness, opacity, and the refusal to communicate.", "I want to achieve a generational change. I want to transform a Democratic Party that has grown old and worn. I do not want a ‘politicians’ party’ ruled by particular politicians; I want to build a ‘Democratic Party for all’, in which the members are the owners.", "My name, ‘Bomi’, comes from ‘bom’, the Korean word for spring — the season when all things come back to life. It is a name for the new season that begins after a long winter.", "And by coincidence, it sounds much like the Swedish word ‘vår’, which means ‘our’ — and also ‘spring’.", "So today, on this square of democracy, I make a pledge. I will smash the hardest wall of unfairness in Korean politics. I will break down the wall of an old politics. I will open a spring of change and renewal."]}}, {"head": {"ko": "다시, 광장에서", "sv": "Än en gång — från torget", "en": "Once More, From the Square"}, "paras": {"ko": ["저는 권력자 뒤에 줄 서는 청년이 되지 않겠습니다. 번호표를 받아 들고 언젠가 차례가 오기만 기다리는 정치도 하지 않겠습니다.", "줄을 서지 않아도 경쟁할 수 있는 정치. 실력으로 평가받을 수 있는 정치. 공정한 규칙 아래 경쟁하는 정치를 만들고 싶습니다.", "저는 청년이 정치의 들러리가 되는 세상을 원하지 않습니다. 청년이 정치의 주인이 되는 세상을 원합니다. 그날까지 멈추지 않겠습니다. 포기하지, 않겠습니다!", "넘어져도 다시 일어나겠습니다. 한국에는 ‘오뚜기’라는 장난감이 있습니다. 아무리 넘어뜨려도 다시 일어섭니다. 저 역시, 그렇게! 하겠습니다! Även när jag faller kommer jag att resa mig igen.", "끝까지 당당하게. 끝까지 직진하겠습니다.", "지금까지, 대한민국의 가장 작은 농촌 마을에서 시작된 이야기, 하지만 대한민국 정치를 바꿀 이야기를 들려드렸습니다.", "공정을 향한 도전. 청년을 위한 도전. 민주주의를 위한 도전. 그 길에, 여러분도 함께 관심을 가져 주시기 바랍니다. 경청해 주셔서 진심으로 감사합니다."], "sv": ["Jag vill inte vara en ung politiker som står längst bak i kön och väntar på tillstånd. Jag vill inte leva i ett system där människor bara väntar på att någon annan ska ge dem en chans.", "Jag vill bygga en politik där människor kan konkurrera utan att stå i kö. Där kompetens betyder mer än kontakter. Där reglerna gäller lika för alla.", "Jag vill inte att unga människor ska vara statister i politiken. Jag vill att de ska vara dess huvudpersoner. Därför kommer jag inte att ge upp. Därför kommer jag att fortsätta.", "I Korea har vi en leksak som alltid reser sig när man välter den. Vi kallar den Ottugi. Jag vill vara som den.", "Med stolthet. Med mod. Och utan att stanna.", "I dag har jag berättat en historia som började i en liten landsbygdskommun i Sydkorea. Men det är också en berättelse om att förändra politiken.", "En kamp för rättvisa. En kamp för unga människor. En kamp för demokratin. Jag hoppas att ni vill följa den resan tillsammans med mig. Tack för att ni har lyssnat."], "en": ["I will not be a young politician who stands at the back of the line behind the powerful. Nor will I practise a politics of taking a numbered ticket and waiting for a turn that may come someday.", "I want to build a politics where you can compete without standing in line. A politics where you can be judged on merit. A politics that competes under fair rules.", "I do not want a world where the young are extras in politics. I want a world where the young are the owners of politics. Until that day comes, I will not stop. I will not give up.", "Even if I fall, I will rise again. In Korea we have a toy called the ‘ottugi’ — a roly-poly doll. No matter how many times you knock it down, it stands back up. I too will be just like that.", "To the very end, with dignity. To the very end, I will go straight ahead.", "Today I have told you a story that began in the smallest rural community in Korea — but a story that will change Korean politics.", "A challenge for fairness. A challenge for the young. A challenge for democracy. I hope that you, too, will take an interest and walk that road together with me. Thank you, from the bottom of my heart, for listening."]}}]};
