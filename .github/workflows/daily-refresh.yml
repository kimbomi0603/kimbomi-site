# ============================================================================
# 매일 아침 지방정부 243곳 집행 자료를 그날 최신 기준일로 다시 받는다 (2026-11-06 신설)
#
# 왜 있나
#   지자체 화면은 열 때(새로고침 포함)마다 지방재정365에서 최신 집행·계약을 다시 받지만,
#   첫 화면 목록·순위(data/index.json)와 검색용 지자체 페이지(lg/*.html)는 마지막 갱신일에 멈춘다.
#   매주 하던 갱신을 매일로 당겨, 첫 화면부터 '오늘 받을 수 있는 가장 최근 기준일'로 맞춘다.
#
# 규칙
#   - tools/refresh_exec.py 의 검증 규칙 그대로(받은 행 수 = 전체 건수, 이전 값과 교차). 못 받은 곳은 이전 기준일 유지.
#   - lg/*.html 은 다시 만들고, 손으로 다듬은 gov/*.html 은 건드리지 않는다(--lg-only).
#   - 정적 검사(tools/verify.js)가 실패하면 커밋하지 않는다.
# ============================================================================
name: daily-refresh

on:
  schedule:
    - cron: '40 21 * * *'   # 매일 06:40 KST
    - cron: '30 14 13 11 *'  # 11.13 23:30 KST 1회 — 11.14 08:00~24:00 지방재정365 중단 전에 미리 받아 둔다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 243곳 집행 자료 갱신
        run: python3 tools/refresh_exec.py
      - name: 전국 세부사업 검색 색인 다시 만들기(같은 기준일)
        run: python3 tools/build_search.py
      - name: 지자체 검색용 페이지 다시 만들기
        run: python3 tools/build_entry.py --lg-only
      - name: 정적 검사
        run: node tools/verify.js
      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "kimbomi0603"
          git config user.email "kimbomi0603@users.noreply.github.com"
          git add -A data lg sitemap.xml
          git commit -m "자료 갱신: 지방정부 집행 $(TZ=Asia/Seoul date +%Y-%m-%d) 기준 재수집"
          git push
