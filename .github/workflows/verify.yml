# ============================================================================
# 배포 전 자동 검증
# 2026-09-04 신설.
#
# 이 파일이 있는 이유:
#   8월·9월 점검마다 같은 종류의 결함(임의 계수로 만든 가짜 수치, 단위 오류,
#   특정 지자체에서만 터지는 렌더 예외)이 반복해서 나왔다. 사람이 매번 기억에
#   의존해 훑었기 때문이다. 이제 push할 때마다 기계가 같은 검사를 똑같이 한다.
#   검사가 실패하면 커밋 옆에 ✗ 가 뜬다.
# ============================================================================
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 정적 검사 (가짜 수치·단위·XSS·관리자 인증)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/verify-format.js     # 공통 표시 유틸 단위 시험
      - run: node tools/verify.js

  render:
    name: 전수 렌더 (243곳 · 차트 정상/CDN 장애)
    # 2026-11-12: ubuntu-latest가 26.04로 바뀐 뒤 playwright 1.49.0이 WebKit 의존 꾸러미(libicu74·libvpx9·libxml2·libx264-164)를
    # 찾지 못해 설치 단계에서 매번 실패했다(검사 자체는 돌지도 못함). playwright 1.49가 지원하는 24.04로 고정한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright@1.49.0
      - run: npx playwright install --with-deps webkit
      - run: node tools/verify-render.js

  pages:
    name: 전 페이지·링크 점검 (오류·깨진 링크·가로 넘침·느림)
    # 2026-11-12: tools/qa-all.js --quick. 모든 쪽과 우리동네365 화면을 PC·휴대폰 너비로 열어
    # 스크립트 오류, 사이트 안 깨진 링크, 깨진 그림, 가로 넘침을 본다. 단추 전부 누르기는 매일 점검(qa-daily.yml)에서.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright@1.49.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/qa-all.js --quick
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qa-pages, path: tools/out/qa-all.md }
