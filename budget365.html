async function loadLg(cd){ if(S.cache[cd]) return S.cache[cd];

  const b64=(await r.text()).trim(); const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); const text=await new Response(s).text();
  const lg=JSON.parse(text); if(lg.rows_v===2){ const D=lg.dict||[]; const g=i=>i==null?undefined:D[i]; for(const y of Object.keys(lg.exec||{})) lg.exec[y].rows=lg.exec[y].rows.map(a=>{ const o={c:a[0],n:g(a[1]),f:g(a[2]),p:g(a[3]),a:g(a[4]),b:a[5],e:a[6]}; if(a[7]!=null) o.nt=a[7]; if(a[8]!=null) o.cp=a[8]; if(a[9]!=null) o.sg=a[9]; if(a[10]) o.x=1; return o; }); }
  const ir=S.index?.rows?.find(x=>x.laf_cd===cd); if(ir&&ir.safety_2025){ (lg.extra||(lg.extra={})).safety_2025=ir.safety_2025; }
  return S.cache[cd]=lg; }

/* ═══════════ 공약 보기 — 중앙선거관리위원회 당선인·공약 실시간 조회 ═══════════ */
const NEC='/api/contract?nec=';
const SG={id:'20260603',prev:'20220601'};
async function necGet(path,q){ const u=NEC+path+'&'+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const r=await fetch(u,{signal:AbortSignal.timeout(30000)}); const j=await r.json(); if(j.ok===false) throw new Error(j.msg||'선관위 조회 실패'); return j.items||[]; }
async function loadWinners(typ){ S.win=S.win||{}; const k=SG.id+'-'+typ; if(S.win[k]) return S.win[k];
  const out=[]; for(let p=1;p<=4;p++){ const it=await necGet('WinnerInfoInqireService2/getWinnerInfoInqire',{sgId:SG.id,sgTypecode:typ,pageNo:p,numOfRows:100}); out.push(...it); if(it.length<100) break; }
  return S.win[k]=out; }
function matchWinner(list,m){ const sido=m.sido_2024||'', gu=m.sigungu_2024||'';
  return list.find(w=>(w.sdName||'')===sido&&(w.wiwName||'')===gu) || list.find(w=>(w.wiwName||'')===gu) || null; }
const STOP=/^(사업|추진|조성|확대|지원|건설|구축|활성화|강화|개선|확충|운영|설치|증대|육성|조기|완료|유치|및|등|위한|통한|지역|우리|시민|군민|구민)$/;
function pledgeTerms(t){ return String(t||'').replace(/[^가-힣A-Za-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=2&&!STOP.test(w)).slice(0,6); }
function pledgeMatch(G,title){ const ts=pledgeTerms(title); if(!ts.length) return {n:0,b:0,e:0,list:[],ts}; 
  const hit=G.filter(p=>ts.some(t=>String(p.n).replace(/\s/g,'').includes(t)));
  return {n:hit.length,b:hit.reduce((a,p)=>a+p.b,0),e:hit.reduce((a,p)=>a+p.e,0),list:hit.sort((a,b)=>b.b-a.b).slice(0,5),ts}; }
async function loadPledge(){ if(S.pl) return S.pl; try{ const r=await fetch('data/pledge.json'); S.pl=r.ok?await r.json():null; }catch(e){ S.pl=null; } return S.pl; }
async function renderPledge(lg){ const cd=lg.laf_cd,m=lg.master,app=document.getElementById('app');
  app.innerHTML=lgBand(lg,'공약')+`<div class="wrap"><div class="loading">당선인·공약 자료를 여는 중…</div></div>`;
  let W=null,P=[],err='',asof='';
  const PL=await loadPledge();
  if(PL&&PL.lg&&PL.lg[cd]){ W=PL.lg[cd].w; P=PL.lg[cd].p||[]; asof=(PL.built_at||'').slice(0,10); }
  else if(PL){ err='이 지자체의 당선인·공약이 사전 수집 자료에 없습니다'; }
  else { /* 실제 사이트에서는 선관위 실시간 조회로 보완 */
    try{ const typ=m.level==='광역'?'3':'4'; const list=await loadWinners(typ); const w=matchWinner(list,m);
      if(w){ W={name:w.name,party:w.jdName,age:w.age,giho:w.giho,dugsu:w.dugsu,dugyul:w.dugyul,edu:w.edu,job:w.job,c1:w.career1,c2:w.career2,sd:w.sdName,wiw:w.wiwName||w.sggName};
        const it=await necGet('ElecPrmsInfoInqireService/getCnddtElecPrmsInfoInqire',{sgId:SG.id,sgTypecode:typ,cnddtId:w.huboid,numOfRows:30});
        const o=it[0]||{}; const cnt=Number(o.prmsCnt||0);
        for(let i=1;i<=Math.max(cnt,12);i++){ const t=o['prmsTitle'+i]; if(!t) continue; P.push({i,t,realm:o['prmsRealmName'+i]||'',body:o['prmmCont'+i]||''}); } } }
    catch(e){ err=e.message; } }
  const e26=lg.exec?.['2026']; const G=e26?groupProjects(e26.rows):[];
  const YRS=Object.keys(lg.exec||{}).sort(); const GY={}; YRS.forEach(y=>{ GY[y]=groupProjects(lg.exec[y].rows); });
  const stOf=mm=>!mm.n?0:(mm.e>0?2:1);   // 0 미반영 · 1 예산 반영 · 2 집행 시작
  const ST=[['미반영','var(--ink-3)','사업명이 겹치는 세부사업 없음'],['예산 반영','#B07A10','관련 사업이 편성됐으나 집행 0'],['집행 시작','var(--teal-ink)','관련 사업 집행 진행']];
  const rows=P.map(p=>{ const m=pledgeMatch(G,p.t); const yrs=YRS.map(y=>({y,m:pledgeMatch(GY[y],p.t)})); return {...p,m,st:stOf(m),yrs}; });

/* ═══════════ 실시간 집행 조회 — 지방재정365 QWGJK 를 /api/lofin 프록시로 직접 호출 ═══════════
   내장 자료(기준일 고정)와 별개로, 오늘부터 최대 21일을 거슬러 자료가 있는 최신 기준일을 찾아 세부사업 전수를 받는다.
   [위험] 큰 지자체(1만 행 이상)는 12장(12,000행) 제한으로 일부만 합산될 수 있어 화면에 「전체 n건 중」을 표시한다.
   [위험] 오늘 날짜는 빈 행이 올 수 있어 유효 행 5건 이상일 때만 채택한다. 실패하면 내장 자료를 그대로 둔다(값을 만들지 않음). */
async function liveExec(cd){ const btn=document.getElementById('liveBtn'); const box=document.getElementById('liveBox'); if(btn){ btn.disabled=true; btn.textContent='지방재정365에서 받는 중…'; }
  const ymd=d=>d.toISOString().slice(0,10).replace(/-/g,'');
  try{ let found=null; const d=new Date();
    for(let i=0;i<21&&!found;i++){ const day=ymd(new Date(d.getTime()-i*86400000)); const r=await fetch(`/api/lofin?hub=QWGJK&fyr=2026&laf_cd=${cd}&exe_ymd=${day}&pSize=5`); const j=await r.json(); if(j&&j.ok&&(j.total||0)>=5) found={day,total:j.total}; }
    if(!found) throw new Error('최근 21일 안에 자료가 있는 기준일을 찾지 못했습니다');
    const pages=Math.min(12,Math.ceil(found.total/1000)); const all=[];
    const got=await Promise.all(Array.from({length:pages},(_,i)=>fetch(`/api/lofin?hub=QWGJK&fyr=2026&laf_cd=${cd}&exe_ymd=${found.day}&pSize=1000&pIndex=${i+1}`).then(r=>r.json()).catch(()=>null)));
    got.forEach(j=>{ if(j&&j.ok&&Array.isArray(j.rows)) all.push(...j.rows); });
    const rows=all.filter(r=>r&&r.dbiz_cd).map(r=>({c:String(r.dbiz_cd),n:r.dbiz_nm||'',f:r.fld_nm||'',p:r.part_nm||'',a:r.acnt_dv_nm||'',b:+r.bdg_cash_amt||0,e:+r.ep_amt||0,nt:+r.bdg_ntep||0,cp:+r.capep||0,sg:+r.sggep||0}));
    if(rows.length<5) throw new Error('받은 행이 너무 적습니다');
    const lg=S.cache[cd]; const base=lg.exec['2026']; if(!lg._exec2026) lg._exec2026=base;
    const b=rows.reduce((a,r)=>a+r.b,0), e=rows.reduce((a,r)=>a+r.e,0);
    lg.exec['2026']={...base,rows,exe_ymd:found.day,dbiz_count:new Set(rows.map(r=>r.c)).size,sum:{...base.sum,budget:b,exec:e,rate:b?Math.round(e/b*1000)/10:null},live:true,live_total:found.total,live_got:all.length,base_ymd:lg._exec2026.exe_ymd,base_sum:lg._exec2026.sum};
    S.diag&&delete S.diag[cd]; renderBudget(lg);
  }catch(err){ if(box) box.innerHTML=`<div class="note" style="margin:0 0 12px"><b>실시간 조회 실패</b> — ${esc(err.message||'오류')}. 내장 자료(${ymd(new Date())} 이전 기준일)를 그대로 보여 드립니다.</div>`; if(btn){ btn.disabled=false; btn.textContent='지금 기준으로 다시 불러오기'; } } }
function liveBanner(e,cd){ if(!e.live) return `<div id="liveBox"><div class="note blue" style="margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span><b>기준일 ${ymd(e.exe_ymd)}</b> 자료입니다. 지방재정365는 매일 갱신되므로 오늘 기준 집행률을 바로 받아 볼 수 있습니다.</span><button type="button" class="btn" id="liveBtn" onclick="liveExec('${cd}')">지금 기준으로 다시 불러오기</button></div></div>`;
  const d=e.sum.exec-(e.base_sum?.exec||0), dr=(e.sum.rate??0)-(e.base_sum?.rate??0);

  if(!lg.exec[B.y]) B.y=years[0]; const e=lg.exec[B.y]; const G=groupProjects(e.rows); const prev=lg.exec[String(Number(B.y)-1)]; const P=prev?Object.fromEntries(groupProjects(prev.rows).map(p=>[p.c,p])):null;

/* 모달 접근성: 열릴 때 포커스를 안으로, Tab 은 모달 안에서만 돌고, 닫으면 열었던 곳으로 돌아간다 */
let MD_PREV=null;
function closeMd(){ const ov=document.getElementById('ov'); if(!ov.classList.contains('open')) return; ov.classList.remove('open'); if(MD_PREV&&MD_PREV.focus){ try{ MD_PREV.focus(); }catch(e){} } MD_PREV=null; }
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeMd(); });
new MutationObserver(()=>{ const ov=document.getElementById('ov'); if(ov.classList.contains('open')){ MD_PREV=document.activeElement; const md=document.getElementById('md'); md.setAttribute('tabindex','-1'); const f=md.querySelector('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'); (f||md).focus({preventScroll:true}); } }).observe(document.getElementById('ov'),{attributes:true,attributeFilter:['class']});
document.addEventListener('keydown',e=>{ const ov=document.getElementById('ov'); if(e.key==='Escape'){ closeMd(); return; }
  if(e.key==='Tab'&&ov.classList.contains('open')){ const f=[...document.getElementById('md').querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null); if(!f.length) return; const a=document.activeElement; if(e.shiftKey&&(a===f[0]||!document.getElementById('md').contains(a))){ e.preventDefault(); f[f.length-1].focus(); } else if(!e.shiftKey&&a===f[f.length-1]){ e.preventDefault(); f[0].focus(); } } });

/* ═══════════ 사업·민원 키워드 검색(전국) — data/search.txt(2026 세부사업 468,403건 + 2025 연말 금액) ═══════════ */
async function gunzipB64(url){ const r=await fetch(url); if(!r.ok) throw new Error('자료 없음: '+url); const b64=(await r.text()).trim(); const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); return JSON.parse(await new Response(st).text()); }

/* 백만원 → 사람이 읽는 단위. 1조 이상이면 '137조 4,949억', 아니면 '9,605억' */
function mkor(v){ if(!isN(v)) return NA; const eok=Math.round(Number(v)/100);

  return eok.toLocaleString('ko-KR')+'억'; }

async function loadSearch(){ if(S.search) return S.search; const [a,b]=await Promise.all([gunzipB64('data/search-a.txt'),gunzipB64('data/search-b.txt')]); return S.search={...a,y25:b.y25}; }
const SYN={'노인일자리':['노인일자리','노인 일자리','시니어','어르신 일자리','노인사회활동'],'청년':['청년'],'아동':['아동','어린이'],'보육':['보육','어린이집','유치원'],'장애인':['장애인'],'축제':['축제','페스티벌','잔치'],'홍보':['홍보','광고'],'도로':['도로','포장','보도'],'하천':['하천','소하천'],'주차장':['주차장','주차'],'경로당':['경로당'],'버스':['버스','대중교통'],'쓰레기':['쓰레기','폐기물','청소'],'CCTV':['CCTV','방범'],'농업':['농업','농촌','농가'],'기본소득':['기본소득','수당'],'문화':['문화','예술','공연'],'체육':['체육','운동','스포츠'],'관광':['관광','여행'],'복지':['복지'],'교육':['교육','학교'],'보건':['보건','건강','의료'],'환경':['환경','기후','탄소'],'재난':['재난','안전','소방'],'일자리':['일자리','고용','취업']};
function termsOf(q){ const parts=q.replace(/\s+/g,' ').trim().split(' ').filter(Boolean); const groups=parts.map(p=>{ const k=Object.keys(SYN).find(k=>k.replace(/\s/g,'')===p.replace(/\s/g,'')); return k?SYN[k]:[p]; }); return groups; }
async function renderSearch(q,sidoF){ sidoF=sidoF||''; const app=document.getElementById('app'); app.innerHTML=`<div class="wrap"><div class="loading">전국 세부사업 색인을 불러와 「${esc(q)}」를 찾는 중… (처음 한 번만 약 17MB)</div></div>`;
  const X=await loadSearch(); const groups=termsOf(q); const names=X.names, flds=X.flds; const nameHit=new Map(); names.forEach((n,i)=>{ const nn=n.replace(/\s/g,''); if(groups.every(g=>g.some(t=>nn.includes(t.replace(/\s/g,''))))) nameHit.set(i,1); });
  const hits=[]; for(const [cd,rows] of Object.entries(X.y26)){ const ix=S.byCd[cd]; if(!ix||ix.live_2026===false) continue; if(sidoF&&ix.sido_new!==sidoF) continue; const p25=new Map((X.y25[cd]||[]).map(r=>[r[0],r])); for(const r of rows){ if(!nameHit.has(r[1])) continue; const prev=p25.get(r[0]); hits.push({cd,c:r[0],n:names[r[1]],f:flds[r[2]],b:r[3]*1e4,e:r[4]*1e4,pb:prev?prev[1]*1e4:null,pe:prev?prev[2]*1e4:null}); } }

      for(const r of rows){ if(have.has(r[0])) continue; const t=lgPuOf(PU,{n:names[r[1]]}); if(!t) continue; if(groups.every(g=>g.some(w=>t.replace(/\s+/g,'').includes(w.replace(/\s+/g,''))))){ const prev=p25.get(r[0]); hits.push({cd,c:r[0],n:names[r[1]],f:flds[r[2]],b:r[3]*1e4,e:r[4]*1e4,pb:prev?prev[1]*1e4:null,pe:prev?prev[2]*1e4:null,pu:puSnip(t,qq)}); nPu++; } } })); }catch(e){}
  const byLg={}; hits.forEach(h=>{ const o=(byLg[h.cd]||={cd:h.cd,n:0,b:0,e:0,pb:0,hasPrev:false}); o.n++; o.b+=h.b; o.e+=h.e; if(h.pb!=null){ o.pb+=h.pb; o.hasPrev=true; } });

  const TB=hits.reduce((a,h)=>a+h.b,0), TE=hits.reduce((a,h)=>a+h.e,0), TP=hits.reduce((a,h)=>a+(h.pb||0),0), nPrev=hits.filter(h=>h.pb!=null).length;
  const byF={}; hits.forEach(h=>{ (byF[h.f||'기타']||={n:0,b:0}); byF[h.f||'기타'].n++; byF[h.f||'기타'].b+=h.b; });

    sug.innerHTML=(v.length>=2?`<div data-q="${esc(v)}"><span>🔎 「${esc(v)}」 사업·민원 전국 검색</span><small>243곳 세부사업</small></div>`:'')+hits.map(x=>`<div data-cd="${x.laf_cd}"><span>${esc(x.display)}</span><small>${x.exec_2026?eok(x.exec_2026.budget)+'억':''}</small></div>`).join('')||'<div class="mut">검색 결과 없음</div>'; sug.style.display='block'; });
  const go=d=>{ if(!d) return; location.hash=d.dataset.cd?'#/lg/'+d.dataset.cd:'#/q/'+encodeURIComponent(d.dataset.q); sug.style.display='none'; q.value=''; };
  sug.addEventListener('click',e=>go(e.target.closest('[data-cd],[data-q]')));
  q.addEventListener('keydown',e=>{ const it=[...sug.querySelectorAll('[data-cd],[data-q]')]; if(e.key==='ArrowDown'){cur=Math.min(it.length-1,cur+1);} else if(e.key==='ArrowUp'){cur=Math.max(0,cur-1);} else if(e.key==='Enter'){ const d=it[cur]||it.find(x=>x.dataset.cd)||it[0]; if(d) go(d); else if(q.value.trim().length>=2){ location.hash='#/q/'+encodeURIComponent(q.value.trim()); sug.style.display='none'; q.value=''; } return; } else if(e.key==='Escape'){sug.style.display='none';return;} else return; it.forEach((x,i)=>x.classList.toggle('on',i===cur)); }); }
bindSearch(document.getElementById('q'),document.getElementById('sug'));
document.addEventListener('click',e=>{ if(!e.target.closest('.search')&&!e.target.closest('.bigq')) document.querySelectorAll('.sug').forEach(s=>s.style.display='none'); });

   자료: 정책브리핑(korea.kr)·부처 누리집 원문을 날짜순으로 모은 것.
   숫자와 날짜는 원문 그대로 두고, 확인되지 않은 항목은 비워 둔다. */

async function loadPolicy(){ if(S.pol) return S.pol;
  const r=await fetch('data/policy.txt'); if(!r.ok) throw new Error('정책 자료 없음');
  const b64=(await r.text()).trim(); const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  S.pol=JSON.parse(await new Response(st).text()); buildNav(); return S.pol; }

const pdate=s=>s?String(s).replace(/-/g,'.'):NA;
const agShort=x=>x.agency_short||String(x.agency||'').split(/[·(]/)[0];

function polFilter(D){ const q=P.q.trim().toLowerCase();
  return D.items.filter(x=>{
    if(P.cat&&x.category!==P.cat) return false;
    if(P.tier&&String(x.tier)!==P.tier) return false;
    if(P.ym&&String(x.date).slice(0,7)!==P.ym) return false;
    if(P.ag&&agShort(x)!==P.ag) return false;
    if(P.dl&&!(x.files&&x.files.length)) return false;
    if(q){ const hay=(x.title+' '+x.summary+' '+x.agency+' '+(x.meeting||'')+' '+x.category).toLowerCase(); if(!hay.includes(q)) return false; }
    return true; }); }

    const PU=await loadLgPu(cd); const hit=G.map(g=>{ const nn=String(g.n).replace(/\s/g,''); const pu=(PU?lgPuOf(PU,g):'').replace(/\s/g,''); const m=kws.filter(k=>{ const kk=k.replace(/\s/g,''); return nn.includes(kk)||(pu&&pu.includes(kk)); }); return m.length?{...g,m}:null; }).filter(Boolean).sort((a,b)=>b.b-a.b);

    const tb=hit.reduce((a,g)=>a+g.b,0), te=hit.reduce((a,g)=>a+g.e,0);
    el.innerHTML=`<div style="font-size:13px;margin:4px 0 6px"><b>★ ${esc(nm)}</b> · 관련 사업 <b>${hit.length}</b>건 · 예산현액 <b>${won(tb)}</b> · 집행률 <b>${pct(tb?te/tb*100:null)}</b> <a href="#/lg/${cd}/budget" style="margin-left:8px;font-weight:700">예산 전체 보기 →</a></div>
      <div class="tw"><table><thead><tr><th>사업명</th><th>분야</th><th class="num">예산현액</th><th class="num">집행률</th><th>맞은 낱말</th></tr></thead><tbody>${hit.slice(0,8).map(g=>`<tr class="row" onclick="openFrom('${cd}',decodeURIComponent('${encodeURIComponent(g.c)}'))"><td><b>${esc(g.n)}</b></td><td class="mut">${esc(g.f||'')}</td><td class="num">${won(g.b)}</td><td class="num">${pct(g.rate)}</td><td class="mut">${g.m.map(esc).join('·')}</td></tr>`).join('')}</tbody></table></div>`;
