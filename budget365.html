tr.row{cursor:pointer}tr.row:hover td{background:var(--gold-soft)!important}
.pg{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 4px;font-family:var(--mono);font-size:12px}
.pg button{border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:5px 12px;cursor:pointer}
.pg button:hover{background:var(--navy);color:#F5F0E4}
.diagk{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:0;margin-top:18px;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}
.diagk > div{background:var(--card);border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:13px 15px}
.diagk .l{font-size:12.5px;color:var(--ink-3);font-weight:500}.diagk .n{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.1;margin:4px 0;color:var(--navy)}.diagk .n small{font-size:11.5px;color:var(--ink-3)}.diagk .s{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(14,42,71,.62);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.ov.open{display:flex}
.md{background:var(--card);border:1px solid var(--navy);max-width:820px;width:100%;box-shadow:0 24px 60px -20px rgba(14,42,71,.5);overflow:hidden}

.md .hd .eyebrow{color:var(--gold)}
.md .hd h3{font-family:var(--disp);font-size:23px;font-weight:900;margin:6px 0 4px;line-height:1.25}

.md .bd{padding:18px 24px 22px}
.md .x{position:absolute;right:14px;top:12px;border:1px solid rgba(245,240,228,.4);background:transparent;color:#F5F0E4;width:32px;height:32px;font-size:19px;cursor:pointer}
.md .x:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.yr{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:0;margin:4px 0 14px;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}

@media (max-width:560px){.tree summary,.tree .leaf{grid-template-columns:minmax(0,1fr) auto auto}.tree .mini{display:none}.tree .n.x{display:none}.kpi .n{font-size:21px}.big{font-size:28px}.modes a{grid-template-columns:auto 1fr}.modes .ar{display:none}.hero h1{font-size:34px}.lgband h1{font-size:30px}}

@media (max-width:900px){.nav a b{display:none}}

<header class="top"><div class="wrap">
  <a class="gohome" href="index.html" aria-label="김보미.com 홈으로 돌아가기"><span aria-hidden="true">←</span> 김보미.com 홈으로</a>
  <a class="brand" href="#/"><span class="mk">365</span>우리동네365</a>
  <nav class="nav"><a href="index.html">김보미.com</a><a href="#/" id="navHome">전국</a><a href="#/sido/전남광주통합특별시">전남·광주</a><a href="#/sido/인천광역시">인천</a><a href="#/sido/서울특별시">서울</a></nav>

</div></header>

<div class="fabs" id="fabs"><button type="button" onclick="goBack()" aria-label="이전 화면으로">← 뒤로</button><button type="button" class="up" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="맨 위로">↑ 맨 위</button></div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="md" id="md"></div></div>

<script>
/* ═══════════ 표시 정책: 값이 없으면 '—'. 0으로 대체하지 않는다. 진짜 0은 0으로 ═══════════ */
const NA='—';
/* 지자체 합동평가(행안부, 17개 시·도) — index.json joint. 원문이 상위 시·도만 밝힌 값은 비워 둔다 */
function gev(cd,k){ const r=S.index?.rows?.find(x=>x.laf_cd===cd); const v=r?r[k]:null; if(v) return v; if(k!=='civil_2025'&&r&&r.civil_2025) return '우수 미선정'; return null; }
function jeList(cd){ const J=S.index?.joint||{}; if(cd==='6100000') return [...(J['2900000']||[]),...(J['4600000']||[])].sort((a,b)=>a.y-b.y||a.nm.localeCompare(b.nm)); return J[cd]||[]; }
function jeTable(cd){ const J=jeList(cd); if(!J.length) return '';
  const cell=(v,u)=>v==null?'<span class="mut">원문 미공개</span>':'<b>'+v+'</b>'+u;
  return `<div class="card" style="margin-top:12px"><h3>지자체 합동평가 5년 <span class="basis">행정안전부 · 정부업무평가위원회 · ${J[0].div}</span></h3>
  <div class="tw"><table><thead><tr><th>평가연도(실적)</th>${J.some(x=>x.nm!==J[0].nm)?'<th>시·도</th>':''}<th class="num">정량 목표달성도</th><th class="num">정성 우수사례</th><th class="num">국민평가 선정</th><th>출처</th></tr></thead><tbody>
  ${J.map(x=>`<tr><td>${x.y} (${x.py})</td>${J.some(z=>z.nm!==J[0].nm)?`<td>${esc(x.nm)}</td>`:''}<td class="num">${cell(x.q,'%')}${x.qr?` <span class="mut">${x.div} ${esc(String(x.qr))}위</span>`:''}</td><td class="num">${cell(x.s,'건')}</td><td class="num">${cell(x.p,'건')}</td><td class="mut">${esc(x.src)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="mut" style="margin-top:8px">원문(결과보고서·보도자료)은 정량 달성도와 일부 연도 정성 건수를 <b>상위 시·도만</b> 공개합니다. 공개되지 않은 값은 '원문 미공개'로 두었습니다.</div></div>`; }
const isN=v=>v!=null&&v!==''&&isFinite(Number(v));
const won=v=>{ if(!isN(v)) return NA; v=Number(v); const a=Math.abs(v); const s=v<0?'-':'';
  if(a>=1e12) return s+(a/1e12).toLocaleString('ko-KR',{maximumFractionDigits:2})+'조원';
  if(a>=1e8) return s+Math.round(a/1e8).toLocaleString('ko-KR')+'억원';
  if(a>=1e4) return s+Math.round(a/1e4).toLocaleString('ko-KR')+'만원';
  return s+Math.round(a).toLocaleString('ko-KR')+'원'; };
const eok=v=>isN(v)?Math.round(Number(v)/1e8).toLocaleString('ko-KR'):NA;
const pct=(v,d=1)=>isN(v)?Number(v).toFixed(d)+'%':NA;
const num=v=>isN(v)?Number(v).toLocaleString('ko-KR'):NA;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=s=>s?String(s).replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3'):NA;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLORS=()=>['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'].map(css);
const sgn=(v,f)=>isN(v)?`<span class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${f(v)}</span>`:NA;

const S={index:null,byCd:{},cache:{},g2b:{},charts:[]};
async function loadIndex(){ const r=await fetch('data/index.json'); S.index=await r.json(); S.index.rows.forEach(x=>S.byCd[x.laf_cd]=x); document.getElementById('stamp').textContent='자료 빌드 '+S.index.built_at.slice(0,10); buildNav(); }
const SIDO_SHORT={'전남광주통합특별시':'전남·광주','서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남','전북특별자치도':'전북','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};
function buildNav(){ const nv=document.querySelector('.nav'); if(!nv||!S.index) return;
  const rows=S.index.rows.filter(x=>x.live_2026&&x.sido_new); const sidos=[...new Set(rows.map(x=>x.sido_new))];
  nv.innerHTML=`<a href="#/" id="navHome">전국 <b>243</b></a>`+sidos.map(s=>{ const k=rows.filter(x=>x.sido_new===s&&x.level==='기초').length;
    return `<a href="#/sido/${encodeURIComponent(s)}">${esc(SIDO_SHORT[s]||s)} <b>${k||'단층'}</b></a>`; }).join(''); }
async function loadLg(cd){ if(S.cache[cd]) return S.cache[cd];
  const r=await fetch('data/'+cd+'.txt'); if(!r.ok) throw new Error('자료 없음');
  const b64=(await r.text()).trim(); const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); const text=await new Response(s).text();
  const lg=JSON.parse(text); if(lg.rows_v===2){ const D=lg.dict||[]; const g=i=>i==null?undefined:D[i]; for(const y of Object.keys(lg.exec||{})) lg.exec[y].rows=lg.exec[y].rows.map(a=>{ const o={c:a[0],n:g(a[1]),f:g(a[2]),p:g(a[3]),a:g(a[4]),b:a[5],e:a[6]}; if(a[7]!=null) o.nt=a[7]; if(a[8]!=null) o.cp=a[8]; if(a[9]!=null) o.sg=a[9]; if(a[10]) o.x=1; return o; }); }
  const ir=S.index?.rows?.find(x=>x.laf_cd===cd); if(ir&&ir.safety_2025){ (lg.extra||(lg.extra={})).safety_2025=ir.safety_2025; }
  return S.cache[cd]=lg; }
async function loadG2b(cd){ if(cd in S.g2b) return S.g2b[cd]; try{ if(!S.g2bAll){ const r=await fetch('data/g2b-all.json'); S.g2bAll=r.ok?await r.json():{}; } const b64=S.g2bAll[cd]; if(!b64){ S.g2b[cd]=null; return null; }
  const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); S.g2b[cd]=JSON.parse(await new Response(st).text()); }catch(e){ S.g2b[cd]=null; } return S.g2b[cd]; }
async function loadCtrt(cd){ if(!S.ctrt) S.ctrt={}; if(cd in S.ctrt) return S.ctrt[cd];
  const sh=cd[0]<='3'?'a':'b';
  try{ S.ctrtAll=S.ctrtAll||{}; if(!S.ctrtAll[sh]){ const r=await fetch('data/ctrt-'+sh+'.json'); S.ctrtAll[sh]=r.ok?await r.json():{}; }
    const b64=S.ctrtAll[sh][cd]; if(!b64){ S.ctrt[cd]=null; return null; }
    const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); S.ctrt[cd]=JSON.parse(await new Response(st).text());
  }catch(e){ S.ctrt[cd]=null; } return S.ctrt[cd]; }
async function saveFile(filename, data, mime){
  try{ if(window.claude&&window.claude.use){ const d=await window.claude.use('downloads');
      if(d&&d.save){ await d.save({filename,data}); return true; } } }catch(e){ if(e&&e.code==='declined') return false; }
  try{ const b=data instanceof Blob?data:new Blob([data],{type:mime||'text/csv;charset=utf-8'});
    const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); return true;
  }catch(e){ alert('이 환경에서는 내려받기가 막혀 있습니다. 사이트에 올린 뒤 내려받아 주세요.'); return false; } }
function csv(rows){ const q=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'); }
function loadJs(src){ return new Promise((ok,no)=>{ if([...document.scripts].some(s=>s.src===src)) return ok(); const el=document.createElement('script'); el.src=src; el.onload=()=>ok(); el.onerror=()=>no(new Error('스크립트를 불러오지 못했습니다')); document.head.appendChild(el); }); }
function killCharts(){ S.charts.forEach(c=>{try{c.destroy()}catch(e){}}); S.charts=[]; }
function chart(id,cfg){ const el=document.getElementById(id); if(!el||typeof Chart==='undefined') return; Chart.defaults.color=css('--ink-2'); Chart.defaults.borderColor=css('--line'); Chart.defaults.font.family=css('--body'); const c=new Chart(el,cfg); S.charts.push(c); return c; }

/* ═══════════ 순위(243, 2024 공시 체계) ═══════════ */
function rank(cd,get,better='high'){ const arr=S.index.rows.filter(x=>x.key_2024&&isN(get(x))); const me=arr.find(x=>x.laf_cd===cd); if(!me) return null; const v=Number(get(me)); const ahead=arr.filter(x=>better==='high'?Number(get(x))>v:Number(get(x))<v).length; const ties=arr.filter(x=>Number(get(x))===v).length; return {r:ahead+1,n:arr.length,t:ties>1?ties:0}; }
const rk=o=>o?`<span class="rk" title="${o.t?'같은 값 '+o.t+'곳 공동':''}">${o.t?'공동 ':''}${o.r}/${o.n}위</span><span class="rkb" aria-hidden="true" title="전국 ${o.n}곳 중 ${o.r}위 위치"><i style="left:${o.n>1?((o.r-1)/(o.n-1)*100).toFixed(1):50}%"></i></span>`:'';

/* ═══════════ 라우팅 ═══════════ */
/* 뒤로 가기 — 이 사이트 안에서 온 기록이 있으면 한 단계 뒤로, 없으면(주소로 바로 들어온 경우) 한 단계 위 화면으로 */
let NAVN=0;
function goBack(){ try{ if(document.getElementById('ov').classList.contains('open')){ closeMd(); return; } }catch(e){}
  if(NAVN>1){ history.back(); return; }
  const h=location.hash.replace(/^#\/?/,'').split('/'); if(h[0]==='lg'&&h[2]){ location.hash='#/lg/'+h[1]; } else if(h[0]==='lg'&&S.byCd[h[1]]){ location.hash='#/sido/'+encodeURIComponent(S.byCd[h[1]].sido_new); } else location.hash='#/'; }
function fabSync(){ const f=document.getElementById('fabs'); if(!f) return; const home=/^#?\/?$/.test(location.hash)||/^#\/sido\//.test(location.hash); f.classList.toggle('show',window.scrollY>(home?600:260)); f.firstElementChild.style.display=home?'none':''; }
window.addEventListener('scroll',fabSync,{passive:true});

window.addEventListener('hashchange',route);
async function route(){ NAVN++; killCharts(); try{ closeMd(); }catch(e){} const h=location.hash.replace(/^#\/?/,''); const [a,cd,sub,pid]=h.split('/');
  try{ if(a==='lg'&&cd){ const lg=await loadLg(cd); if(sub==='budget'){ await renderBudget(lg,pid); } else renderLg(lg); if(pid&&sub==='budget') openProject(lg,decodeURIComponent(pid)); }
  else if(a==='q'&&cd){ await renderSearch(decodeURIComponent(cd),sub?decodeURIComponent(sub):''); }
  else renderHome(a==='sido'?decodeURIComponent(cd||''):''); }
  catch(e){ document.getElementById('app').innerHTML=`<div class="wrap"><div class="loading">자료를 불러오지 못했습니다 — ${esc(e.message)}</div></div>`; }
  document.querySelectorAll('.nav a').forEach(x=>x.classList.toggle('on',x.getAttribute('href')===location.hash||(x.id==='navHome'&&!location.hash)));
  window.scrollTo(0,0); fabSync(); }

/* ═══════════ 홈: 광역 → 기초 격자 ═══════════ */
function renderHome(sido){ const R=S.index.rows; const live=R.filter(x=>x.live_2026); const sidos=[...new Set(live.map(x=>x.sido_new))];
  const cur=sido||'전남광주통합특별시'; const list=R.filter(x=>x.sido_new===cur&&x.level==='기초'&&x.live_2026); const hq=R.find(x=>x.sido_new===cur&&x.level==='광역'&&x.live_2026);
  const withExec=live.filter(x=>x.exec_2026); const dbiz=withExec.reduce((a,x)=>a+x.exec_2026.dbiz,0); const bud=withExec.reduce((a,x)=>a+x.exec_2026.budget,0); const exe=withExec.reduce((a,x)=>a+x.exec_2026.exec,0);
  const asof=withExec[0]?.exec_2026?.exe_ymd;

function groupProjects(rows){ const g={}; rows.forEach(r=>{ const k=r.c||r.n; if(!g[k]) g[k]={c:k,n:r.n,f:r.f,p:r.p,a:new Set(),b:0,e:0,nt:0,cp:0,sg:0,et:0,x:0,rows:[]}; const o=g[k]; o.b+=r.b||0; o.e+=r.e||0; o.nt+=r.nt||0; o.cp+=r.cp||0; o.sg+=r.sg||0; o.et+=r.et||0; if(r.a) o.a.add(r.a); if(r.x) o.x=1; o.rows.push(r); }); return Object.values(g).map(o=>({...o,a:[...o.a].join('·'),rate:o.b>0?Math.round(o.e/o.b*1000)/10:null})); }

  out.over={l:'과다편성 의심',d:'전년 연말 집행률 70% 미만인데 올해 예산현액이 전년 이상(동결·증액)',items:P?G.filter(p=>P[p.c]&&P[p.c].b>=1e8&&P[p.c].rate!=null&&P[p.c].rate<70&&p.b>=P[p.c].b).map(p=>({...p,note:'전년 집행률 '+pct(P[p.c].rate)+' · 올해 '+eok(p.b)+'억(전년 '+eok(P[p.c].b)+'억)'})).sort((a,b)=>b.b-a.b):[]};
  out.promo={l:'행사·축제·홍보성',d:'사업명에 축제·행사·홍보·기념·박람회·엑스포·캠페인 등이 포함(사업명 기준이라 목적 확인 필요)',items:G.filter(p=>PROMO.test(p.n)).map(p=>({...p,note:'올해 예산현액 '+eok(p.b)+'억 · 집행 '+pct(p.rate)})).sort((a,b)=>b.b-a.b)};

function vhash(v){ let h=0; for(let i=0;i<v.length;i++) h=((h<<5)-h+v.charCodeAt(i)*2654435761)>>>0; return h; }
async function loadVendor(){ if(S.vend!==undefined) return S.vend; try{ const r=await fetch('data/vendor.json'); S.vend=r.ok?await r.json():null; }catch(e){ S.vend=null; }

async function vendorOf(name){ const V=await loadVendor(); if(!V) return null; const k=vnorm(name); const sh=String(vhash(k)%(V.meta.sh||3));
  if(!S.vendSh[sh]){ const b64=V.sh[sh]; if(!b64) return null; const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); S.vendSh[sh]=JSON.parse(await new Response(st).text()); }
  return {meta:V.meta, e:S.vendSh[sh][k]||null, key:k}; }

/* ═══════════ 공약 보기 — 중앙선거관리위원회 당선인·공약 실시간 조회 ═══════════ */
const NEC='/api/contract?nec=';
const SG={id:'20260603',prev:'20220601'};
async function necGet(path,q){ const u=NEC+path+'&'+Object.entries(q).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const r=await fetch(u,{signal:AbortSignal.timeout(30000)}); const j=await r.json(); if(j.ok===false) throw new Error(j.msg||'선관위 조회 실패'); return j.items||[]; }
async function loadWinners(typ){ S.win=S.win||{}; const k=SG.id+'-'+typ; if(S.win[k]) return S.win[k];
  const out=[]; for(let p=1;p<=4;p++){ const it=await necGet('WinnerInfoInqireService2/getWinnerInfoInqire',{sgId:SG.id,sgTypecode:typ,pageNo:p,numOfRows:100}); out.push(...it); if(it.length<100) break; }
  return S.win[k]=out; }
function matchWinner(list,m){ const sido=m.sido_2024||'', gu=m.sigungu_2024||'';
  return list.find(w=>(w.sdName||'')===sido&&(w.wiwName||'')===gu) || list.find(w=>(w.wiwName||'')===gu) || null; }
const STOP=/^(사업|추진|조성|확대|지원|건설|구축|활성화|강화|개선|확충|운영|설치|증대|육성|조기|완료|유치|및|등|위한|통한|지역|우리|시민|군민|구민)$/;
function pledgeTerms(t){ return String(t||'').replace(/[^가-힣A-Za-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=2&&!STOP.test(w)).slice(0,6); }
function pledgeMatch(G,title){ const ts=pledgeTerms(title); if(!ts.length) return {n:0,b:0,e:0,list:[],ts}; 
  const hit=G.filter(p=>ts.some(t=>String(p.n).replace(/\s/g,'').includes(t)));
  return {n:hit.length,b:hit.reduce((a,p)=>a+p.b,0),e:hit.reduce((a,p)=>a+p.e,0),list:hit.sort((a,b)=>b.b-a.b).slice(0,5),ts}; }
async function loadPledge(){ if(S.pl) return S.pl; try{ const r=await fetch('data/pledge.json'); S.pl=r.ok?await r.json():null; }catch(e){ S.pl=null; } return S.pl; }
async function renderPledge(lg){ const cd=lg.laf_cd,m=lg.master,app=document.getElementById('app');
  app.innerHTML=lgBand(lg,'공약')+`<div class="wrap"><div class="loading">당선인·공약 자료를 여는 중…</div></div>`;

  if(PL&&PL.lg&&PL.lg[cd]){ W=PL.lg[cd].w; P=PL.lg[cd].p||[]; asof=(PL.built_at||'').slice(0,10); }
  else if(PL){ err='이 지자체의 당선인·공약이 사전 수집 자료에 없습니다'; }
  else { /* 실제 사이트에서는 선관위 실시간 조회로 보완 */
    try{ const typ=m.level==='광역'?'3':'4'; const list=await loadWinners(typ); const w=matchWinner(list,m);
      if(w){ W={name:w.name,party:w.jdName,age:w.age,giho:w.giho,dugsu:w.dugsu,dugyul:w.dugyul,edu:w.edu,job:w.job,c1:w.career1,c2:w.career2,sd:w.sdName,wiw:w.wiwName||w.sggName};
        const it=await necGet('ElecPrmsInfoInqireService/getCnddtElecPrmsInfoInqire',{sgId:SG.id,sgTypecode:typ,cnddtId:w.huboid,numOfRows:30});
        const o=it[0]||{}; const cnt=Number(o.prmsCnt||0);
        for(let i=1;i<=Math.max(cnt,12);i++){ const t=o['prmsTitle'+i]; if(!t) continue; P.push({i,t,realm:o['prmsRealmName'+i]||'',body:o['prmmCont'+i]||''}); } } }
    catch(e){ err=e.message; } }
  const e26=lg.exec?.['2026']; const G=e26?groupProjects(e26.rows):[];
  const rows=P.map(p=>({...p,m:pledgeMatch(G,p.t)}));
  const okN=rows.filter(r=>r.m.n).length, sumB=rows.reduce((a,r)=>a+r.m.b,0);
  app.innerHTML=lgBand(lg,'공약')+`<div class="wrap"><section class="sec" style="margin-top:22px">

    <div><div class="l">등록 공약</div><div class="n">${num(P.length)}<small>건</small></div><div class="s">선관위 공약마당 등록 기준</div></div>
    <div><div class="l">예산에 이름이 닿은 공약</div><div class="n">${num(okN)}<small>/${num(P.length)}</small></div><div class="s">사업명 키워드 매칭</div></div>
    <div><div class="l">관련 사업 예산현액 합계</div><div class="n">${eok(sumB)}<small>억원</small></div><div class="s">2026 · 중복 포함</div></div>

async function gunzipB64(url){ const r=await fetch(url); if(!r.ok) throw new Error('자료 없음: '+url); const b64=(await r.text()).trim(); const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); return JSON.parse(await new Response(st).text()); }

function termsOf(q){ const parts=q.replace(/\s+/g,' ').trim().split(' ').filter(Boolean); const groups=parts.map(p=>{ const k=Object.keys(SYN).find(k=>k.replace(/\s/g,'')===p.replace(/\s/g,'')); return k?SYN[k]:[p]; }); return groups; }
async function renderSearch(q,sidoF){ sidoF=sidoF||''; const app=document.getElementById('app'); app.innerHTML=`<div class="wrap"><div class="loading">전국 세부사업 색인을 불러와 「${esc(q)}」를 찾는 중… (처음 한 번만 약 17MB)</div></div>`;

  <div class="card"><h3>사업명 유형 <span class="basis">같은 이름으로 여러 지자체가 쓰는 사업</span></h3><div class="tw"><table><thead><tr><th>사업명</th><th class="num">지자체 수</th><th class="num">예산현액 합계</th></tr></thead><tbody>${(()=>{ const g={}; hits.forEach(h=>{ (g[h.n]||={k:new Set(),b:0}); g[h.n].k.add(h.cd); g[h.n].b+=h.b; }); return Object.entries(g).sort((a,b)=>b[1].k.size-a[1].k.size||b[1].b-a[1].b).slice(0,15).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num">${v.k.size}</td><td class="num">${won(v.b)}</td></tr>`).join(''); })()}</tbody></table></div></div></div>

  <p class="src">검색은 지방재정365 세부사업별 세출(QWGJK)의 사업명 문자열 일치로만 찾습니다(사업 목적·내용은 보지 못함 — 이름에 없으면 빠질 수 있음). 금액은 만원 단위로 반올림한 색인값이며 지자체 화면의 원 단위 값과 반올림 차이가 있을 수 있습니다. 1인당은 2024 공시 인구 기준. 색인 빌드 ${X.built_at.slice(0,10)}.</p></section>`:''}</div>`;
  document.getElementById('foot').innerHTML=footer(); }
async function openFrom(cd,c){ try{ const lg=await loadLg(cd); openProject(lg,c); }catch(e){ alert('자료를 불러오지 못했습니다'); } }

/* ═══════════ 검색(상단·히어로 공용) ═══════════ */
function bindSearch(q,sug){ if(!q||!sug||q._bound) return; q._bound=1; let cur=-1;
  q.addEventListener('input',()=>{ const v=q.value.trim(); cur=-1; if(!v){sug.style.display='none';return;} const hits=S.index.rows.filter(x=>x.live_2026&&(x.display.includes(v)||(x.key_2024||'').includes(v))).slice(0,12);
    sug.innerHTML=(v.length>=2?`<div data-q="${esc(v)}"><span>🔎 「${esc(v)}」 사업·민원 전국 검색</span><small>243곳 세부사업</small></div>`:'')+hits.map(x=>`<div data-cd="${x.laf_cd}"><span>${esc(x.display)}</span><small>${x.exec_2026?eok(x.exec_2026.budget)+'억':''}</small></div>`).join('')||'<div class="mut">검색 결과 없음</div>'; sug.style.display='block'; });
  const go=d=>{ if(!d) return; location.hash=d.dataset.cd?'#/lg/'+d.dataset.cd:'#/q/'+encodeURIComponent(d.dataset.q); sug.style.display='none'; q.value=''; };
  sug.addEventListener('click',e=>go(e.target.closest('[data-cd],[data-q]')));
  q.addEventListener('keydown',e=>{ const it=[...sug.querySelectorAll('[data-cd],[data-q]')]; if(e.key==='ArrowDown'){cur=Math.min(it.length-1,cur+1);} else if(e.key==='ArrowUp'){cur=Math.max(0,cur-1);} else if(e.key==='Enter'){ const d=it[cur]||it.find(x=>x.dataset.cd)||it[0]; if(d) go(d); else if(q.value.trim().length>=2){ location.hash='#/q/'+encodeURIComponent(q.value.trim()); sug.style.display='none'; q.value=''; } return; } else if(e.key==='Escape'){sug.style.display='none';return;} else return; it.forEach((x,i)=>x.classList.toggle('on',i===cur)); }); }
bindSearch(document.getElementById('q'),document.getElementById('sug'));
document.addEventListener('click',e=>{ if(!e.target.closest('.search')&&!e.target.closest('.bigq')) document.querySelectorAll('.sug').forEach(s=>s.style.display='none'); });
