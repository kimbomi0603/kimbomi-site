  <g>
    <rect x="20" y="182" width="160" height="36" rx="18" fill="url(#scarf)"/>
    <rect x="24" y="185" width="152" height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>
    <rect x="146" y="208" width="26" height="32" rx="9" fill="url(#scarf)" transform="rotate(10 159 224)"/>
    <text x="100" y="207" text-anchor="middle" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="19" font-weight="900" fill="#FFD447" letter-spacing="5">더불이</text>
