<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 252" role="img" aria-label="에그 더불이">
  <defs>
    <radialGradient id="shell" cx="0.35" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.38" stop-color="#FFF3D0"/>
      <stop offset="0.74" stop-color="#F5D98A"/>
      <stop offset="1" stop-color="#D9AE4E"/>
    </radialGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D8FE0"/>
      <stop offset="0.62" stop-color="#0E56AC"/>
      <stop offset="1" stop-color="#063A78"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
