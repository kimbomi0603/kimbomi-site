      <stop offset="1" stop-color="#4CAF5E"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD884"/>
      <stop offset="1" stop-color="#3E9A4E"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B23C"/>
      <stop offset="1" stop-color="#D98D14"/>
    </linearGradient>
    <clipPath id="mouthClip"><path d="M86 148 h28 a2 2 0 0 1 2 2 v2 a16 14 0 0 1 -32 0 v-2 a2 2 0 0 1 2 -2 Z"/></clipPath>
  </defs>

  <!-- 날개(뒤) -->
  <g>
    <ellipse cx="24" cy="160" rx="18" ry="30" fill="url(#shell)" stroke="#D9AE4E" stroke-width="1.5" transform="rotate(22 24 160)"/>
    <ellipse cx="176" cy="160" rx="18" ry="30" fill="url(#shell)" stroke="#D9AE4E" stroke-width="1.5" transform="rotate(-22 176 160)"/>
  </g>

  <!-- 발 -->
  <ellipse cx="72" cy="243" rx="17" ry="8" fill="url(#foot)"/>
  <ellipse cx="128" cy="243" rx="17" ry="8" fill="url(#foot)"/>

  <!-- 새싹 -->
  <g transform="translate(100 24) rotate(-4)">
    <rect x="-5" y="-14" width="10" height="26" rx="5" fill="url(#stem)"/>
    <path d="M-4 -10 C-30 -26 -34 -2 -12 -2 C-6 -2 -4 -6 -4 -10 Z" fill="url(#leaf)"/>
    <path d="M4 -10 C30 -26 34 -2 12 -2 C6 -2 4 -6 4 -10 Z" fill="url(#leaf)"/>
    <circle cx="-18" cy="-16" r="3.4" fill="#EAF7FF" opacity="0.95"/>
  </g>

  <!-- 몸통(계란) -->
  <path d="M100 20 C146 20 173 84 173 152 C173 205 141 242 100 242 C59 242 27 205 27 152 C27 84 54 20 100 20 Z" fill="url(#shell)"/>
  <!-- 음영 -->
  <path d="M100 20 C146 20 173 84 173 152 C173 205 141 242 100 242 C120 230 148 204 148 150 C148 90 128 34 100 20 Z" fill="#B8862B" opacity="0.18"/>
  <!-- 광택 -->
  <ellipse cx="66" cy="72" rx="20" ry="30" fill="#FFFFFF" opacity="0.85" transform="rotate(-22 66 72)"/>
  <ellipse cx="46" cy="128" rx="7" ry="11" fill="#FFFFFF" opacity="0.5" transform="rotate(-18 46 128)"/>

  <!-- 눈 -->
  <g>
    <ellipse cx="74" cy="120" rx="8.5" ry="13" fill="#2A1F16"/>
    <circle cx="71" cy="114" r="3.2" fill="#FFF"/>
    <circle cx="77" cy="126" r="1.8" fill="#FFF" opacity="0.6"/>
    <ellipse cx="126" cy="120" rx="8.5" ry="13" fill="#2A1F16"/>
    <circle cx="123" cy="114" r="3.2" fill="#FFF"/>
    <circle cx="129" cy="126" r="1.8" fill="#FFF" opacity="0.6"/>
