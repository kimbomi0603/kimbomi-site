  <!-- 볼 -->
  <ellipse cx="50" cy="144" rx="14" ry="8.5" fill="#FFB3AD" opacity="0.8"/>
  <ellipse cx="150" cy="144" rx="14" ry="8.5" fill="#FFB3AD" opacity="0.8"/>
  <!-- 입 -->
  <path d="M86 148 h28 a2 2 0 0 1 2 2 v2 a16 14 0 0 1 -32 0 v-2 a2 2 0 0 1 2 -2 Z" fill="#8A4B3A"/>
  <ellipse cx="100" cy="166" rx="10" ry="6" fill="#FF9D94" clip-path="url(#mouthClip)"/>

