<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페이지를 찾을 수 없습니다 — 김보미.com</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="assets/brand/kb-icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#F5F2EA;--ink:#1C1B18;--mut:#5E6660;--green:#0F5C46;--green-d:#0B3F31;--navy:#0E2A47;--gold:#E0A43C;--line:#E2DCCB}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink);text-align:center;padding:28px 18px;word-break:keep-all}
.box{max-width:460px;width:100%}
.logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--navy);font-weight:900;font-size:19px;margin-bottom:26px}
.logo img{width:34px;height:34px;border-radius:9px}
.code{font-size:clamp(64px,18vw,96px);font-weight:900;line-height:1;color:var(--green);letter-spacing:-.03em}
.code small{display:block;font-size:13px;letter-spacing:.24em;color:var(--gold);font-weight:800;margin-top:6px}
h1{font-size:clamp(20px,5.4vw,25px);font-weight:900;margin:18px 0 10px;color:var(--ink)}
p{font-size:15px;line-height:1.75;color:var(--mut)}
p b{color:var(--ink)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.btn{display:block;text-decoration:none;font-size:15.5px;font-weight:800;padding:15px 16px;border-radius:12px;transition:.12s;border:1.5px solid transparent}
.btn.pri{color:#fff;background:var(--green)}
.btn.pri:hover{background:var(--green-d)}
.btn.sec{color:var(--navy);background:#fff;border-color:var(--line)}
.btn.sec:hover{border-color:var(--navy)}
.btn.ghost{color:var(--mut);background:transparent;border-color:var(--line);font-weight:700;font-size:14px;padding:12px}
footer{margin-top:28px;font-size:12px;color:var(--mut)}
footer a{color:inherit}
</style>
</head>
<body>
<div class="box">
  <a class="logo" href="/"><img src="assets/brand/kb-icon.svg" alt="">김보미<span style="color:var(--green)">.com</span></a>
  <div class="code">404<small>PAGE NOT FOUND</small></div>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 이미 없어진 페이지입니다.<br><b>아래에서 원하시는 곳으로 바로 이동하실 수 있습니다.</b></p>
  <div class="btns">
    <a class="btn pri" href="/budget365.html">우리동네365 — 내 동네 예산·집행·계약 확인</a>
    <a class="btn sec" href="/">홈으로 가기</a>
    <a class="btn ghost" href="/about.html">김보미는 · 걸어온 길</a>
  </div>
  <footer>© 2026 김보미 · 재정주권시민행동 공동대표 · <a href="/">김보미.com</a></footer>
</div>
</body>
</html>
