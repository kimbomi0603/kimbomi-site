<script>
"use strict";
var $=function(id){return document.getElementById(id);};
var API="/api/posts";
var HASHTAGS="#민주당을살려야합니다 #이번생에살립시다 #김보미";
var posts=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
/* 게시일은 항상 한국시간(KST, UTC+9) 기준으로 표기 — 해외 접속 시에도 페이스북 원문과 날짜가 일치하도록 */
function fmtDate(ms){ if(!ms)return ''; try{var d=new Date(ms+32400000);return d.getUTCFullYear()+'.'+('0'+(d.getUTCMonth()+1)).slice(-2)+'.'+('0'+d.getUTCDate()).slice(-2);}catch(e){return '';} }
function excerpt(body){ var t=String(body||'').replace(/\n+/g,' ').replace(/\[[^\]]*\]/g,'').replace(/https?:\/\/[^\s]+/g,'').replace(/\s+/g,' ').trim(); return t.slice(0,90); }
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}

function renderList(){
  var el=$('plist');
  if(!posts.length){ el.innerHTML='<div class="empty">아직 발행된 글이 없습니다.</div>'; return; }
  el.innerHTML=posts.map(function(p){
    return '<a class="pcard" href="?post='+encodeURIComponent(p.id)+'" data-id="'+esc(p.id)+'">'
      +'<div class="meta"><span class="chip">김보미 생각</span><span>'+fmtDate(p.publishAt)+'</span></div>'
      +'<h2>'+esc(p.title)+'</h2>'
      +'<div class="ex">'+esc(excerpt(p.body))+'…</div>'
      +'<div class="go">전문 읽기 →</div></a>';
  }).join('');
}
var ARTICLE_LINKS=[{url:"https://www.hani.co.kr/arti/politics/politics_general/1266723.html?utm_source=copy&utm_medium=copy&utm_campaign=btn_share&utm_content=20260706",refs:["['젊은 층은 민주당' 무너진 구도...2030 외면 시 재집권 없다] 기사","[ '젊은 층은 민주당' 무너진 구도...2030 외면 시 재집권 없다 ] 기사"]}];function linkifyArticles(h){ARTICLE_LINKS.forEach(function(it){var a='<a href="'+it.url+'" target="_blank" rel="noopener">';it.refs.forEach(function(ref){h=h.split(ref).join(a+ref+'</a>');});});return h;}function ytId(t){
  var s=String(t||'').trim();
  var mv=s.match(/^\[video:([A-Za-z0-9_-]{6,20})\]$/);
  if(mv) return mv[1];
  s=s.replace(/^\[\s*/,'').replace(/\s*\]$/,'').trim();
  if(!/^https?:\/\/[^\s]+$/.test(s)) return '';
  if(s.indexOf('youtu')<0) return '';
  var m=s.match(/[?&]v=([A-Za-z0-9_-]{6,20})/);
  if(m) return m[1];
  m=s.match(/youtu\.be\/([A-Za-z0-9_-]{6,20})/);
  if(m) return m[1];
  m=s.match(/\/(embed|shorts|live)\/([A-Za-z0-9_-]{6,20})/);
  if(m) return m[2];
  return '';
}
/* 본문 자동 서식 — 소제목·부제·번호 약속·다짐 목록·날짜 서명을 보기 좋게 꾸밈 */
function dec(t){ return linkifyArticles(esc(t)).replace(/\n/g,'<br>'); }
function richPara(t){
  // 부제목: "— ... —" 형태
  if(/^[—–-]\s?.+[—–-]$/.test(t) && t.length<90) return '<p class="p-sub">'+esc(t.replace(/^[—–-]\s?|\s?[—–-]$/g,''))+'</p>';
  // 소제목: 첫째, 둘째, … / "…합니다." 로 끝나는 한 문장 선언형 헤딩
  if(/^(첫째|둘째|셋째|넷째|다섯째|여섯째|일곱째|여덟째|아홉째|열째)[,.]/.test(t)) return '<p class="p-head">'+dec(t)+'</p>';
  // 번호 약속: "1) 제목 문장. 내용…" → 첫 문장 진하게
  var mn=t.match(/^(\d{1,2}\))\s?([\s\S]*)$/);
  if(mn){
    var body=mn[2], cut=body.search(/다\.(\s|$)/);
    if(cut>-1 && cut<130){
      var head=mn[1]+' '+body.slice(0,cut+2), rest=body.slice(cut+2).trim();
      return '<p class="p-num"><b>'+esc(head)+'</b>'+(rest?dec(rest):'')+'</p>';
    }
    return '<p class="p-num"><b>'+esc(t)+'</b></p>';
  }
  // 다짐 목록: "— …하겠습니다." / "- …"
  if(/^[—–-]\s/.test(t)) return '<p class="p-li">'+dec(t.replace(/^[—–-]\s/,'✔ '))+'</p>';
  // 날짜·서명
  if(/^\d{4}년\s?\d{1,2}월/.test(t)) return '<p class="p-date">'+dec(t)+'</p>';
  // 짧은 호소·외침: "존경하는 당원 여러분, 국민 여러분!" 등
  if(t.length<=46 && /[!！]$/.test(t) && t.indexOf('\n')<0) return '<p class="p-callout">'+esc(t)+'</p>';
  return '<p>'+dec(t)+'</p>';
}
/* 기사 링크 → 미리보기 카드 (썸네일·제목·요약은 /api/og 로 비동기 로딩) */
var OG_SEQ=0;
function linkCard(t, fallbackTitle){
  if(t.indexOf('원문 보기')<0) return '';
  var m=t.match(/https?:\/\/[^\s<>"']+/);
  if(!m) return '';
  var url=m[0].replace(/[.,)\]]+$/,'');
  var host=''; try{ host=new URL(url).hostname.replace(/^www\./,''); }catch(e){ host='link'; }
  /* '사진 → <이미지주소>' 줄이 있으면 그 이미지를 썸네일로 우선 사용 */
  var thumb='';
  var pm=t.match(/사진\s*(?:→|->|:)\s*(https?:\/\/[^\s<>"']+)/);
  if(pm){ thumb=pm[1].replace(/[.,)\]]+$/,''); }
  var head=t.replace(url,'')
             .replace(pm?pm[0]:'','')
             .replace(/(기사\s*)?원문\s*보기\s*(→|->|:)?/g,'')
             .split('\n').map(function(x){return x.trim();})
             .filter(function(x){return x.length>0;})
             .join(' ').replace(/\s{2,}/g,' ').trim();
  if(head.length<18 || /(글|기사|링크)입니다\.?$/.test(head)) head=fallbackTitle||head;
  var cid='og'+(++OG_SEQ);
  return '<a class="lcard'+(thumb?' wide':'')+'" id="'+cid+'" data-og="'+esc(url)+'" href="'+esc(url)+'" target="_blank" rel="noopener">'
       +   '<span class="lc-thumb'+(thumb?' has-img':'')+'">'
       +     (thumb ? '<img src="'+esc(thumb)+'" alt="" loading="lazy">' : '<span class="lc-ph">📰</span>')
       +   '</span>'
       +   '<span class="lc-body">'
       +     '<span class="lc-src">'+esc(host.toUpperCase())+'</span>'
       +     '<span class="lc-title">'+esc(head)+'</span>'
       +     '<span class="lc-desc"></span>'
       +     '<span class="lc-go">기사 원문 보기 <b>↗</b></span>'
       +   '</span>'
       + '</a>';
}
/* 카드에 실제 대표 이미지·제목·요약 채우기 */
function hydrateCards(root){
  var cards=(root||document).querySelectorAll('.lcard[data-og]');
  Array.prototype.forEach.call(cards, function(card){
    var url=card.getAttribute('data-og');
    card.removeAttribute('data-og');
    fetch('/api/posts?action=og&v=2&url='+encodeURIComponent(url)).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok) return;
      if(d.site){ card.querySelector('.lc-src').textContent=d.site.toUpperCase(); }
      if(d.title && d.title.length>8){ card.querySelector('.lc-title').textContent=d.title; }
      if(d.desc && d.desc.length>10){
        var el=card.querySelector('.lc-desc');
        el.textContent=d.desc; el.classList.add('on');
      }
      if(d.image && !card.querySelector('.lc-thumb img')){
        var im=new Image();
        im.onload=function(){
          var th=card.querySelector('.lc-thumb');
          th.innerHTML=''; th.appendChild(im); th.classList.add('has-img');
          card.classList.add('wide');
        };
        im.onerror=function(){};
        im.alt=''; im.src=d.image;   /* loading='lazy' 는 DOM 밖 이미지 로딩을 막으므로 쓰지 않음 */
      }
    }).catch(function(){});
  });
}
function renderDetail(p){
  var paras=String(p.body||'').split(/\n{2,}/).map(function(t){return t.trim();}).filter(Boolean);
  var html='<div class="meta">'+fmtDate(p.publishAt)+'</div><h1>'+esc(p.title)+'</h1>';
  paras.forEach(function(t){
    var im=t.match(/^\[img:([^\]]+)\]$/);
    if(im){ html+='<figure class="pfig"><img src="'+esc(im[1])+'" alt="" loading="lazy"></figure>'; return; }
    var vd=ytId(t);
    if(vd){ html+='<figure class="vfig"><div class="vbox"><iframe src="https://www.youtube.com/embed/'+esc(vd)+'" title="영상" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></figure>'; return; }
    var lc=linkCard(t, p.title);
    if(lc){ html+=lc; return; }
    if(/^\[.*\]$/.test(t)){ html+='<p class="tagline">'+esc(t.replace(/^\[\s*|\s*\]$/g,''))+'</p>'; }
    else { html+=richPara(t); }
  });
  html+='<div class="share"><button class="btn p" id="shareBtn">📢 공유하기</button><a class="btn g" href="vision.html">← 다른 글 보기</a></div>';
  $('article').innerHTML=html;
  hydrateCards($('article'));
  $('listView').classList.add('hide'); $('detailView').classList.remove('hide');
  window.scrollTo(0,0);
  $('shareBtn').addEventListener('click',function(){ doShare(p); });
}
function doShare(p){
  var text='「'+p.title+'」 — 김보미 생각 · '+HASHTAGS;
  var url='https://www.xn--4k0b53xuva.com/vision.html?post='+encodeURIComponent(p.id);
  if(navigator.share){ navigator.share({title:p.title,text:text,url:url}).catch(function(){}); return; }
  try{ navigator.clipboard.writeText(text+' '+url); toast('링크가 복사됐어요'); }catch(e){ prompt('복사해 공유하세요', text+' '+url); }
}
function showById(id){
  var p=posts.filter(function(x){return x.id===id;})[0];
  if(p){ renderDetail(p); }
  else {
    // 목록에 없으면 개별 조회
    fetch(API+'?action=get&id='+encodeURIComponent(id)).then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok&&d.item){ renderDetail(d.item); } else { showList(); }
    }).catch(showList);
  }
}
function showList(){ $('detailView').classList.add('hide'); $('listView').classList.remove('hide'); }

$('backBtn').addEventListener('click',function(e){ e.preventDefault(); history.pushState(null,'','vision.html'); showList(); });
$('plist').addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('.pcard'); if(!a) return;
  e.preventDefault(); var id=a.getAttribute('data-id');
  history.pushState(null,'','?post='+encodeURIComponent(id)); showById(id);
});
window.addEventListener('popstate',function(){ route(); });
function route(){
  var id=new URLSearchParams(location.search).get('post');
  if(id){ showById(id); } else { showList(); }
}
var _bg=document.getElementById('burger'),_mn=document.getElementById('menu');
if(_bg&&_mn){ _bg.addEventListener('click',function(){_mn.classList.toggle('open');}); _mn.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){_mn.classList.remove('open');});}); }
function mergeStatic(items){
  var st=(window.KB_STATIC_POSTS||[]).slice();
  var ids={}; items.forEach(function(p){ids[p.id]=1;});
  st.forEach(function(p){ if(!ids[p.id]) items.push(p); });
  items.sort(function(a,b){ return (b.publishAt||0)-(a.publishAt||0); });
  return items;
}
fetch(API+'?action=list').then(function(r){return r.json();}).then(function(d){
  posts=mergeStatic((d&&d.ok&&d.items)?d.items:[]);
  renderList(); route();
}).catch(function(){
  posts=mergeStatic([]);
  if(posts.length){ renderList(); route(); }
  else { $('plist').innerHTML='<div class="empty">불러올 수 없어요. 잠시 후 다시 시도해주세요.</div>'; }
});
</script>
