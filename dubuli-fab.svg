<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" role="img" aria-label="AI 챗봇 더불이 열기">
  <defs>
    <radialGradient id="shell" cx="0.35" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.38" stop-color="#FFF3D0"/>
      <stop offset="0.74" stop-color="#F5D98A"/>
      <stop offset="1" stop-color="#D9AE4E"/>
    </radialGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D8FE0"/>
      <stop offset="0.62" stop-color="#0E56AC"/>
      <stop offset="1" stop-color="#063A78"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8BE8"/>
      <stop offset="1" stop-color="#0B4C9C"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4EDA6"/>
      <stop offset="1" stop-color="#4CAF5E"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD884"/>
      <stop offset="1" stop-color="#3E9A4E"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B23C"/>
      <stop offset="1" stop-color="#D98D14"/>
    </linearGradient>
    <clipPath id="mouthClipF"><path d="M-14 -2 h28 a2 2 0 0 1 2 2 v2 a16 14 0 0 1 -32 0 v-2 a2 2 0 0 1 2 -2 Z"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ===== 말풍선 보드 ===== -->
  <g filter="url(#soft)">
    <rect x="176" y="52" width="272" height="132" rx="30" fill="url(#board)" stroke="#FFD447" stroke-width="5"/>
    <path d="M196 168 L166 206 L226 178 Z" fill="#0B4C9C" stroke="#FFD447" stroke-width="5" stroke-linejoin="round"/>
    <rect x="188" y="62" width="248" height="34" rx="17" fill="#FFFFFF" opacity="0.14"/>
    <text x="312" y="118" text-anchor="middle" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">더불이 챗봇</text>
    <text x="312" y="158" text-anchor="middle" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="24" font-weight="800" fill="#FFD447">무엇이든 물어봐요! 💬</text>
  </g>
  <text x="440" y="46" text-anchor="middle" font-size="30">✨</text>
  <text x="196" y="34" text-anchor="middle" font-size="24">✨</text>

  <!-- ===== 에그 더불이 ===== -->
  <g transform="translate(8 22) scale(0.93)" filter="url(#soft)">
    <!-- 날개(뒤) -->
    <ellipse cx="24" cy="160" rx="18" ry="30" fill="url(#shell)" stroke="#D9AE4E" stroke-width="1.5" transform="rotate(22 24 160)"/>
    <ellipse cx="176" cy="160" rx="18" ry="30" fill="url(#shell)" stroke="#D9AE4E" stroke-width="1.5" transform="rotate(-42 176 160)"/>
    <!-- 발 -->
    <ellipse cx="72" cy="243" rx="17" ry="8" fill="url(#foot)"/>
    <ellipse cx="128" cy="243" rx="17" ry="8" fill="url(#foot)"/>
    <!-- 새싹 -->
    <g transform="translate(100 24) rotate(-4)">
      <rect x="-5" y="-14" width="10" height="26" rx="5" fill="url(#stem)"/>
      <path d="M-4 -10 C-30 -26 -34 -2 -12 -2 C-6 -2 -4 -6 -4 -10 Z" fill="url(#leaf)"/>
      <path d="M4 -10 C30 -26 34 -2 12 -2 C6 -2 4 -6 4 -10 Z" fill="url(#leaf)"/>
      <circle cx="-18" cy="-16" r="3.4" fill="#EAF7FF" opacity="0.95"/>
    </g>
    <!-- 몸통 -->
    <path d="M100 20 C146 20 173 84 173 152 C173 205 141 242 100 242 C59 242 27 205 27 152 C27 84 54 20 100 20 Z" fill="url(#shell)"/>
    <path d="M100 20 C146 20 173 84 173 152 C173 205 141 242 100 242 C120 230 148 204 148 150 C148 90 128 34 100 20 Z" fill="#B8862B" opacity="0.18"/>
    <ellipse cx="66" cy="72" rx="20" ry="30" fill="#FFFFFF" opacity="0.85" transform="rotate(-22 66 72)"/>
    <ellipse cx="46" cy="128" rx="7" ry="11" fill="#FFFFFF" opacity="0.5" transform="rotate(-18 46 128)"/>
    <!-- 눈/볼/입 -->
    <ellipse cx="74" cy="120" rx="8.5" ry="13" fill="#2A1F16"/>
    <circle cx="71" cy="114" r="3.2" fill="#FFF"/>
    <ellipse cx="126" cy="120" rx="8.5" ry="13" fill="#2A1F16"/>
    <circle cx="123" cy="114" r="3.2" fill="#FFF"/>
    <ellipse cx="50" cy="144" rx="14" ry="8.5" fill="#FFB3AD" opacity="0.8"/>
    <ellipse cx="150" cy="144" rx="14" ry="8.5" fill="#FFB3AD" opacity="0.8"/>
    <g transform="translate(100 150)">
      <path d="M-14 -2 h28 a2 2 0 0 1 2 2 v2 a16 14 0 0 1 -32 0 v-2 a2 2 0 0 1 2 -2 Z" fill="#8A4B3A"/>
      <ellipse cx="0" cy="16" rx="10" ry="6" fill="#FF9D94" clip-path="url(#mouthClipF)"/>
    </g>
    <!-- 목도리 -->
    <rect x="20" y="182" width="160" height="36" rx="18" fill="url(#scarf)"/>
    <rect x="24" y="185" width="152" height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>
    <rect x="146" y="208" width="26" height="32" rx="9" fill="url(#scarf)" transform="rotate(10 159 224)"/>
    <text x="100" y="207" text-anchor="middle" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="19" font-weight="900" fill="#FFD447" letter-spacing="5">더불이</text>
  </g>
</svg>
